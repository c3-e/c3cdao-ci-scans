# Image-side vulnerability scanning shared by every image-scan matrix leg:
# default scanner configs, docker-load the built image artifact, Trivy image
# scan, Grype image scan, Grype image-SBOM scan. Source-SBOM generation and
# source scans stay in the primary image-scan leg (whole-repo, run once).
# Same SECURITY_SCAN_BLOCKING exit-code semantics in every consumer — the
# caller passes vars.SECURITY_SCAN_BLOCKING through blocking.
name: Image vulnerability scan (Trivy + Grype)
description: >-
  Default .trivyignore/.grype.yaml when the consumer lacks them, download and
  docker-load the image tarball artifact, download the image SBOM artifact,
  then run Trivy (image) and Grype (image + image SBOM). Blocking behavior is
  driven by the blocking input (vars.SECURITY_SCAN_BLOCKING).
inputs:
  image-tag:
    description: "Local-daemon tag to scan (restored by docker load)."
    required: true
  image-artifact-name:
    description: "Artifact name of the docker-save tarball (e.g. scan-image, scan-image-<name>)."
    required: true
  sbom-artifact-name:
    description: "Artifact name of the image SBOM (e.g. sbom-image, sbom-image-<name>); download-artifact writes the file named after artifact-name."
    required: true
  trivy-severity:
    description: "Trivy severity filter (env.TRIVY_SEVERITY)."
    required: true
  blocking:
    description: "'true' makes scans fail the build (vars.SECURITY_SCAN_BLOCKING); anything else reports only."
    required: false
    default: "false"
  chart-path:
    description: "Path to the Helm chart (e.g. 'chart', 'apps/myapp/helm'). Used to derive PILOT for vex-tracking OCI artifact. Optional; vex-tracking steps skip if Chart.yaml is not found."
    required: false
    default: "chart"
runs:
  using: composite
  steps:
    # Consumers aren't required to carry scanner config files — default to
    # empty ones so Trivy/Grype don't error on a missing path. plan's
    # suppression-format lint already blocks a non-empty .trivyignore/
    # .grype.yaml before this job can run, so "honor if present" only ever
    # sees an empty file here — OpenVEX is the one real suppression
    # surface. Same no-op-when-absent pattern for OpenVEX: consumers opt in by committing
    # .openvex/templates/main.openvex.json (data-only onboarding, resolved
    # against the caller checkout cwd like .trivyignore); absent that, an
    # empty-statements doc is written to RUNNER_TEMP so the scan steps can
    # reference one unconditionally. Verified against the pinned CLIs: an
    # empty-statements doc produces bit-identical findings to no VEX doc
    # at all.
    - name: Default scanner configs when consumer lacks them
      shell: bash
      run: |
        [ -f .trivyignore ] || : > .trivyignore
        [ -f .grype.yaml ] || echo 'ignore: []' > .grype.yaml
        if [ -f .openvex/templates/main.openvex.json ]; then
          vex_doc="${PWD}/.openvex/templates/main.openvex.json"
        else
          vex_doc="${RUNNER_TEMP}/empty.openvex.json"
          cat > "$vex_doc" <<'VEXEOF'
        {
          "@context": "https://openvex.dev/ns/v0.2.0",
          "@id": "https://openvex.dev/docs/public/vex-c3cdao-ci-scans-empty-default",
          "author": "c3cdao-ci-scans image-vuln-scan (empty no-op default; consumer has no .openvex/)",
          "timestamp": "2026-01-01T00:00:00Z",
          "version": 1,
          "statements": []
        }
        VEXEOF
        fi
        # The pinned trivy-action does not forward ambient env to its inner
        # step; trivy-config: -> TRIVY_CONFIG is its explicitly wired route.
        printf 'vulnerability:\n  vex:\n    - %s\n' "$vex_doc" > "${RUNNER_TEMP}/trivy-vex.yaml"
        # Precompute what the export-bundle steps below need and publish it
        # via GITHUB_ENV: the resolved VEX doc + generated Trivy config, and
        # the artifact-name parts — leg name from the scan-image-<name>
        # artifact convention, short sha for per-run uniqueness. The export
        # dir must exist before the JSON export scans write into it.
        mkdir -p "${RUNNER_TEMP}/security-export"
        leg="${IMAGE_ARTIFACT_NAME#scan-image-}"
        {
          echo "VEX_DOC=${vex_doc}"
          echo "VEX_TRIVY_CONFIG=${RUNNER_TEMP}/trivy-vex.yaml"
          echo "EXPORT_LEG=${leg}"
          echo "EXPORT_SHORT_SHA=${GITHUB_SHA:0:7}"
        } >> "$GITHUB_ENV"
      env:
        IMAGE_ARTIFACT_NAME: ${{ inputs.image-artifact-name }}

    - name: Download image artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: ${{ inputs.image-artifact-name }}

    - name: Load image into local daemon
      shell: bash
      run: docker load -i image.tar

    # Grype derives OpenVEX product identity exclusively from the image's
    # repoDigests; a docker-load'ed local build has none, so every committed
    # product PURL is a silent no-op on the Grype image leg (F-T6-2,
    # discovered on the petegpt VEX canary). A job-local registry gives the
    # image a real, deterministic, digest-backed identity: consumers author
    # statements against repository_url=localhost:5000/<name> (Trivy form)
    # and repository_url=localhost:5000 (Grype form) — stable across builds,
    # per-build digest recorded in the export bundle's metadata.json.
    - name: Publish image to job-local registry (VEX product identity)
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        # docker inspect alone only proves the name is taken, not that the
        # registry is serving — a leftover *stopped* container (e.g. a
        # reused/self-hosted runner) would pass that check, then the loop
        # below spins for 30s against a dead endpoint. Check running state
        # and clear a stale container before recreating it.
        if ! docker inspect -f '{{.State.Running}}' vex-registry 2>/dev/null | grep -q true; then
          docker rm -f vex-registry >/dev/null 2>&1 || true
          docker run -d --name vex-registry -p 127.0.0.1:5000:5000 \
            registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373  # registry:2
        fi
        for _ in $(seq 1 30); do
          curl -fsS http://127.0.0.1:5000/v2/ >/dev/null 2>&1 && break
          sleep 1
        done
        scan_ref="localhost:5000/${IMAGE_TAG}"
        docker tag "$IMAGE_TAG" "$scan_ref"
        docker push -q "$scan_ref"
        # Re-pull so the daemon records the registry repoDigest (push alone
        # is not guaranteed to on every storage driver); layers are cached,
        # this is metadata-cheap.
        docker rmi "$scan_ref" >/dev/null
        docker pull -q "$scan_ref"
        # Fail-closed even for report-only consumers: a missing repoDigest
        # means committed VEX statements silently stop matching on Grype —
        # an infrastructure fault, not a scan finding, so it fails the job
        # regardless of the blocking input.
        docker image inspect --format '{{join .RepoDigests "\n"}}' "$scan_ref" \
          | grep -q '^localhost:5000/' \
          || { echo "::error::job-local registry repoDigest missing — Grype VEX product identity would silently no-op (F-T6-2)"; exit 1; }
        echo "SCAN_REF=${scan_ref}" >> "$GITHUB_ENV"

    - name: Download image SBOM
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: ${{ inputs.sbom-artifact-name }}

    - name: Trivy scan — image
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        # Registry-backed reference (not the bare load tag): both scanners
        # must compute the localhost:5000 product identity VEX matches on.
        image-ref: ${{ env.SCAN_REF }}
        format: table
        severity: ${{ inputs.trivy-severity }}
        exit-code: ${{ inputs.blocking == 'true' && '1' || '0' }}
        # No ignore-unfixed: the modular pr-gate/sca-scan surfaced unfixed
        # HIGH/CRITICAL too, so we keep reporting them (no coverage reduction).
        trivyignores: .trivyignore
        # OpenVEX consumption (vulnerability.vex in the config file): real
        # consumer template or the empty no-op default from the step above.
        trivy-config: ${{ env.VEX_TRIVY_CONFIG }}

    - name: Grype scan — image
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
      # OpenVEX consumption, image leg only — scoped to this step's own env
      # (not GITHUB_ENV-ambient) so the SBOM leg below stays VEX-free.
      env:
        GRYPE_VEX_DOCUMENTS: ${{ env.VEX_DOC }}
      with:
        image: ${{ env.SCAN_REF }}
        severity-cutoff: high
        fail-build: ${{ inputs.blocking == 'true' }}
        output-format: table
        config: .grype.yaml

    # Deliberately NO VEX wiring on the SBOM leg: at the current pin,
    # anchore/sbom-action's CycloneDX root metadata.component carries no
    # purl, so there is no product identity for GRYPE_VEX_DOCUMENTS to
    # match against — VEX here would be a silent no-op that looks wired
    # but isn't. Revisit only if the sbom-action pin changes its CycloneDX
    # output shape.
    - name: Grype scan — image SBOM
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
      with:
        sbom: ${{ inputs.sbom-artifact-name }}  # anchore/sbom-action stores artifact as file named after artifact-name
        severity-cutoff: high
        fail-build: ${{ inputs.blocking == 'true' }}
        output-format: table
        config: .grype.yaml

    # ------------------------------------------------------------------------
    # Per-run security export bundle. Machine-readable evidence for one
    # image-scan leg, downloadable via `gh run download`: both scan JSONs
    # (tables above stay for logs), the image SBOM, the VEX doc exactly as
    # applied (real consumer template or the empty default), and
    # metadata.json. Every step is `if: always()` so the bundle uploads even
    # when blocking=true fails the table scans above. JSON re-scans reuse
    # JSON re-scans reuse the DBs the table scans already downloaded and
    # the same VEX doc (.trivyignore/.grype.yaml are always empty by
    # construction — plan's suppression-format lint blocks any real
    # entry), so the JSONs mirror what gated.
    - name: Trivy scan — image (JSON for export)
      if: always()
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      with:
        # Fallback: if the registry publish failed, this always() step still
        # captures evidence against the load tag (VEX identity degraded but
        # the bundle survives, which is when it matters).
        image-ref: ${{ env.SCAN_REF || inputs.image-tag }}
        format: json
        output: ${{ runner.temp }}/security-export/trivy-image.json
        severity: ${{ inputs.trivy-severity }}
        exit-code: '0'
        trivyignores: .trivyignore
        trivy-config: ${{ env.VEX_TRIVY_CONFIG }}

    - name: Grype scan — image (JSON for export)
      if: always()
      id: grype-export
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
      env:
        GRYPE_VEX_DOCUMENTS: ${{ env.VEX_DOC }}
      with:
        image: ${{ env.SCAN_REF || inputs.image-tag }}
        severity-cutoff: high
        fail-build: false
        output-format: json
        config: .grype.yaml

    - name: Assemble security export bundle
      if: always()
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.image-tag }}
        SCAN_REF: ${{ env.SCAN_REF }}
        SBOM_FILE: ${{ inputs.sbom-artifact-name }}
        BLOCKING: ${{ inputs.blocking }}
        GRYPE_JSON: ${{ steps.grype-export.outputs.json }}
        VEX_APPLIED: ${{ env.VEX_DOC }}
        # github.job_workflow_sha never populates for a job invoked from a
        # reusable workflow — long-open runner bug, never fixed on that
        # field: https://github.com/actions/runner/issues/2417. Likewise
        # github.workflow_ref (and its $GITHUB_WORKFLOW_REF env mirror) is
        # caller-scoped: it resolves to the consumer's own workflow file,
        # not this gate's. job.workflow_sha / job.workflow_ref are GitHub's
        # shipped replacement for exactly this reusable-workflow case — map
        # both explicitly, same as everything else in this env: block.
        GATE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        GATE_WORKFLOW_REF: ${{ job.workflow_ref }}
      run: |
        set -euo pipefail
        export_dir="${RUNNER_TEMP}/security-export"
        mkdir -p "$export_dir"
        cp "$SBOM_FILE" "$export_dir/sbom-image.cdx.json"
        cp "$GRYPE_JSON" "$export_dir/grype-image.json"
        cp "$VEX_APPLIED" "$export_dir/vex-applied.openvex.json"
        vex_source="consumer"
        case "$VEX_APPLIED" in "${RUNNER_TEMP}"/*) vex_source="empty-default" ;; esac
        # Digest from the registry-backed reference the scanners actually
        # scanned (localhost:5000 repoDigest) — per-build precise even
        # though the committed VEX product forms are version-less.
        image_digest="$(docker image inspect --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}{{.Id}}{{end}}' "${SCAN_REF:-$IMAGE_TAG}")"
        # trivy-action leaves the pinned CLI on PATH; version + DB metadata
        # come from `trivy version -f json` (grype's from its own report).
        trivy_version="$(trivy version -f json 2>/dev/null | jq -c . 2>/dev/null || echo '{}')"
        [ -n "$trivy_version" ] || trivy_version='{}'
        jq -n \
          --arg image_tag "$IMAGE_TAG" \
          --arg scan_ref "${SCAN_REF:-$IMAGE_TAG}" \
          --arg image_digest "$image_digest" \
          --arg blocking "$BLOCKING" \
          --arg vex_source "$vex_source" \
          --arg gate_workflow_ref "${GATE_WORKFLOW_REF:-}" \
          --arg gate_workflow_sha "${GATE_WORKFLOW_SHA:-}" \
          --arg caller_sha "${GITHUB_SHA:-}" \
          --arg run_id "${GITHUB_RUN_ID:-}" \
          --argjson trivy "$trivy_version" \
          --slurpfile grype_report "$export_dir/grype-image.json" \
          '{
            image: {tag: $image_tag, scan_ref: $scan_ref, digest: $image_digest},
            blocking: $blocking,
            vex: {source: $vex_source, file: "vex-applied.openvex.json"},
            scanners: {
              trivy: {version: ($trivy.Version // "unknown"), db: ($trivy.VulnerabilityDB // null)},
              grype: ($grype_report[0].descriptor | {version: .version, db: (.db // null)})
            },
            gate: {workflow_ref: $gate_workflow_ref, workflow_sha: $gate_workflow_sha},
            run: {caller_sha: $caller_sha, run_id: $run_id}
          }' > "$export_dir/metadata.json"
        ls -l "$export_dir"

    # VEX Tracking: read/merge/write a durable tracking record of unresolved
    # findings, preserving first_issued timestamps across runs. Unsigned OCI
    # artifact stored independently of the app image, combining BOTH Trivy and
    # Grype JSON exports (never just one) so no scanner's findings are
    # silently dropped from tracking. Runs after "Assemble security export
    # bundle" so trivy-image.json/grype-image.json are guaranteed to exist —
    # running any earlier would always see empty findings. Every step here is
    # continue-on-error: failures are logged loudly (::error/::warning) but
    # never fail the job: this is advisory tracking data, and
    # evaluate_security_gate.py never reads any of these steps' outcomes.
    - name: Derive PILOT name from Chart.yaml
      id: pilot
      if: always()
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        chart_path="${{ inputs.chart-path }}"
        if [ ! -f "${chart_path}/Chart.yaml" ]; then
          echo "::notice::Chart.yaml not found at ${chart_path}/Chart.yaml; skipping vex-tracking (no chart for this caller, e.g. image_only)"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        NAME="$(yq eval '.name' "${chart_path}/Chart.yaml")"
        if [ "$NAME" = "null" ] || [ -z "$NAME" ]; then
          echo "::error::Chart.yaml at ${chart_path}/Chart.yaml exists but its .name field is missing or null — cannot derive vex-tracking PILOT"
          exit 1
        fi
        echo "pilot=$NAME" >> "$GITHUB_OUTPUT"
        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Set up oras CLI
      if: always() && steps.pilot.outputs.skip == 'false'
      continue-on-error: true
      uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d  # v2.0.1

    # Verified live (selftest-vex-tracking.yml canary run): an
    # UNAUTHENTICATED oras pull against a package path that has never had
    # anything pushed to it under this org returns "denied: requested
    # access to the resource is denied" — NOT a clean 404 — even though an
    # anonymous pull against an existing-but-empty-tag path (verified
    # separately, direct oras pull against a real public GHCR package)
    # does return a proper "not found". Authenticating first makes a
    # genuinely first-ever pull behave like the tolerable 404 case; skip
    # this and every real pilot's very first run would misclassify as a
    # real failure and never populate the tracking doc.
    - name: Log in to GHCR for oras
      if: always() && steps.pilot.outputs.skip == 'false'
      continue-on-error: true
      shell: bash
      run: echo "${{ github.token }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

    - name: Pull prior vex-tracking record from OCI
      id: vex-pull
      if: always() && steps.pilot.outputs.skip == 'false'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        pilot="${{ steps.pilot.outputs.pilot }}"
        registry_ref="ghcr.io/c3-e/vex-tracking/${pilot}:latest"
        prior_doc_dir="${RUNNER_TEMP}/vex-prior"
        mkdir -p "$prior_doc_dir"

        set +e
        # oras >=1.3 blocks writing outside the current working directory
        # by default ("path traversal disallowed") — verified live, this
        # trips on ANY absolute -o destination, not just malicious input.
        # $RUNNER_TEMP is GitHub Actions' own standard temp dir, not
        # untrusted; --allow-path-traversal is the documented remedy.
        pull_output="$(oras pull "$registry_ref" -o "$prior_doc_dir" --allow-path-traversal 2>&1)"
        pull_exit=$?
        set -e

        if [ $pull_exit -eq 0 ] && [ -f "$prior_doc_dir/vex-tracking.json" ]; then
          echo "prior_doc=$prior_doc_dir/vex-tracking.json" >> "$GITHUB_ENV"
          echo "::notice::Loaded prior vex-tracking record from ${registry_ref}"
        elif [ $pull_exit -eq 0 ]; then
          # Verified live: oras pull exiting 0 does not guarantee the file
          # landed at -o's target — if the pushed artifact's title
          # annotation was ever an absolute path (a prior bug, fixed at
          # push time below), oras follows THAT path instead of -o,
          # silently. Trust the filesystem, not the exit code: if it isn't
          # where expected, that's a real failure, never a silent
          # first-run fallback (which would reset every first_issued).
          echo "::error::oras pull exited 0 but ${prior_doc_dir}/vex-tracking.json does not exist — refusing to treat this as first-run state. Pull output: ${pull_output}"
          echo "vex_pull_real_failure=true" >> "$GITHUB_ENV"
        elif echo "$pull_output" | grep -q "Error response from registry:.*not found"; then
          # Genuine first-run 404 (registry has no such tag yet) — verified
          # against a real anonymous pull against ghcr.io, this exact message
          # shape. Expected on first run, not a failure.
          echo "::notice::No prior vex-tracking record at ${registry_ref} (first run); proceeding with empty prior state"
          echo "prior_doc=" >> "$GITHUB_ENV"
        else
          # Any other failure (auth, network, registry outage, oras missing
          # because setup-oras itself failed) — never treat this as "no prior
          # state": that would silently reset every finding's first_issued.
          # Fail loud and skip merge/push for this run instead.
          echo "::error::vex-tracking pull from ${registry_ref} failed for a reason other than 'not found' — refusing to treat this as first-run state. Output: ${pull_output}"
          echo "vex_pull_real_failure=true" >> "$GITHUB_ENV"
        fi

    - name: Merge vex-tracking record with current findings
      id: vex-merge
      if: always() && steps.pilot.outputs.skip == 'false' && env.vex_pull_real_failure != 'true'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail

        trivy_findings_file="-"
        if [ -f "${RUNNER_TEMP}/security-export/trivy-image.json" ]; then
          trivy_findings_file="${RUNNER_TEMP}/security-export/trivy-image.json"
        fi
        grype_findings_file="-"
        if [ -f "${RUNNER_TEMP}/security-export/grype-image.json" ]; then
          grype_findings_file="${RUNNER_TEMP}/security-export/grype-image.json"
        fi
        if [ "$trivy_findings_file" = "-" ] && [ "$grype_findings_file" = "-" ]; then
          echo "::error::Neither trivy-image.json nor grype-image.json exists in ${RUNNER_TEMP}/security-export — vex-tracking must run after both JSON export steps"
          exit 1
        fi

        prior_doc_arg="-"
        if [ -n "${prior_doc:-}" ] && [ -f "$prior_doc" ]; then
          prior_doc_arg="$prior_doc"
        fi

        human_disposition_arg="-"
        if [ -f ".openvex/templates/main.openvex.json" ]; then
          human_disposition_arg=".openvex/templates/main.openvex.json"
        fi

        merged_doc_file="${RUNNER_TEMP}/vex-tracking-merged.json"
        python3 "${{ github.action_path }}/../../../scripts/lib/vex_tracking.py" \
          "$prior_doc_arg" \
          "$trivy_findings_file" \
          "$grype_findings_file" \
          "$human_disposition_arg" \
          > "$merged_doc_file"

        # Also land this doc inside security-export/ (not just push it to
        # GHCR) — the disposition report script has no network access and
        # can only ever read from the exported bundle; without this copy
        # it has no way to reach first_issued for age computation.
        cp "$merged_doc_file" "${RUNNER_TEMP}/security-export/vex-tracking.json"

        echo "merged_doc=$merged_doc_file" >> "$GITHUB_ENV"
        echo "::notice::Generated merged vex-tracking record with $(jq '.statements | length' "$merged_doc_file") unresolved findings (Trivy: ${trivy_findings_file}, Grype: ${grype_findings_file})"

    - name: Push vex-tracking record to OCI
      id: vex-push
      if: always() && steps.pilot.outputs.skip == 'false' && env.vex_pull_real_failure != 'true'
      continue-on-error: true
      shell: bash
      run: |
        set -euo pipefail
        merged_doc="${merged_doc:-}"

        if [ -z "$merged_doc" ] || [ ! -f "$merged_doc" ]; then
          echo "::warning::Merged vex-tracking record not found; skipping push"
          exit 0
        fi

        pilot="${{ steps.pilot.outputs.pilot }}"
        registry_ref="ghcr.io/c3-e/vex-tracking/${pilot}:latest"
        push_dir="${RUNNER_TEMP}/vex-push"
        mkdir -p "$push_dir"
        cp "$merged_doc" "$push_dir/vex-tracking.json"

        echo "::notice::Pushing vex-tracking record to ${registry_ref}"
        # Verified live: pushing with an absolute file path (plus
        # --disable-path-validation to get past oras's normal refusal of
        # one) bakes that ABSOLUTE SOURCE PATH into the blob's title
        # annotation. A later `oras pull -o <dir>` then follows the
        # recorded title instead of -o — on this runner that happened to
        # still resolve (same $RUNNER_TEMP layout), but pulling the same
        # artifact from anywhere else failed outright ("mkdir /home/runner:
        # operation not supported"). cd into push_dir and reference the
        # file by its bare relative name so the recorded title is just
        # "vex-tracking.json" — no path-validation override needed at all.
        ( cd "$push_dir" && oras push "$registry_ref" vex-tracking.json:application/json ) 2>&1 || {
          code=$?
          echo "::warning::vex-tracking push to ${registry_ref} failed with code $code (advisory; does not fail gate)"
          exit 0
        }
        echo "::notice::Successfully pushed vex-tracking record"

    - name: Upload security export bundle
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: security-export-${{ env.EXPORT_LEG }}-${{ env.EXPORT_SHORT_SHA }}
        path: ${{ runner.temp }}/security-export/
        if-no-files-found: error
