# Extras legs must inherit the primary leg's failover behavior bit-for-bit —
# never specialize this action per build-matrix leg.
name: Login to hardened base registries
description: >-
  Docker-login to Chainguard (cgr.dev) and/or Iron Bank, scoped to the
  hardened-base-registry tier (chainguard | ironbank | both), when their
  credential pairs are present (with retry; a failed login is never reported
  as authenticated), resolve the effective builder/runtime base images (Iron
  Bank failover only when CGR is absent and Iron Bank present), and fail or
  warn per require-hardened-bases when no attempted registry authenticated.
  The primary-base failover behavior is shared verbatim by every build matrix
  leg (extras inherit the primary failover) — preserve bit-for-bit.
inputs:
  cgr-pull-token:
    description: "Chainguard pull token (secrets.CGR_PULL_TOKEN); empty when unset."
    required: false
    default: ""
  cgr-pull-username:
    description: "Chainguard pull username (secrets.CGR_PULL_USERNAME); empty when unset."
    required: false
    default: ""
  ironbank-token:
    description: "Iron Bank token (secrets.IRONBANK_TOKEN); empty when unset."
    required: false
    default: ""
  ironbank-username:
    description: "Iron Bank username (secrets.IRONBANK_USERNAME); empty when unset."
    required: false
    default: ""
  ironbank-registry:
    description: "Iron Bank registry host (inputs.ironbank_registry)."
    required: true
  hardened-base-registry:
    description: "Caller-declared hardened-base tier (inputs.hardened_base_registry): 'chainguard' attempts only the Chainguard login, 'ironbank' attempts only Iron Bank, 'both' (default) attempts both, matching prior behavior."
    required: false
    default: "both"
  builder-image:
    description: "Consumer-specified builder base image (inputs.builder_image)."
    required: true
  runtime-image:
    description: "Consumer-specified runtime base image (inputs.runtime_image)."
    required: true
  ironbank-builder-image:
    description: "Optional Iron Bank replacement builder image, applied only on primary-base failover (inputs.ironbank_builder_image)."
    required: false
    default: ""
  ironbank-runtime-image:
    description: "Optional Iron Bank replacement runtime image, applied only on primary-base failover (inputs.ironbank_runtime_image)."
    required: false
    default: ""
  require-hardened-bases:
    description: "Hardened-base policy (inputs.require_hardened_bases): 'true' fails when no credentials; 'false' warns and builds on consumer-specified bases."
    required: true
outputs:
  builder_image:
    description: "Effective builder base image after failover resolution."
    value: ${{ steps.login.outputs.builder_image }}
  runtime_image:
    description: "Effective runtime base image after failover resolution."
    value: ${{ steps.login.outputs.runtime_image }}
runs:
  using: composite
  steps:
    - name: Login and resolve base images
      id: login
      shell: bash
      env:
        CGR_PULL_TOKEN: ${{ inputs.cgr-pull-token }}
        CGR_PULL_USERNAME: ${{ inputs.cgr-pull-username }}
        IRONBANK_TOKEN: ${{ inputs.ironbank-token }}
        IRONBANK_USERNAME: ${{ inputs.ironbank-username }}
        IRONBANK_REGISTRY: ${{ inputs.ironbank-registry }}
        BUILDER_IMAGE_IN: ${{ inputs.builder-image }}
        RUNTIME_IMAGE_IN: ${{ inputs.runtime-image }}
        IB_BUILDER_IMAGE: ${{ inputs.ironbank-builder-image }}
        IB_RUNTIME_IMAGE: ${{ inputs.ironbank-runtime-image }}
        REQUIRE_HARDENED_BASES: ${{ inputs.require-hardened-bases }}
        HARDENED_BASE_REGISTRY: ${{ inputs.hardened-base-registry }}
      run: |
        set -uo pipefail
        login_retry() { # <registry> <username> <token>
          local attempt=1 delay=15
          until printf '%s' "$3" | docker login "$1" -u "$2" --password-stdin; do
            if [ "$attempt" -ge 4 ]; then echo "$1 login failed after 4 attempts" >&2; return 1; fi
            echo "$1 login failed (attempt $attempt/4); retrying in ${delay}s..." >&2
            sleep "$delay"; delay=$((delay * 2)); attempt=$((attempt + 1))
          done
        }
        builder="$BUILDER_IMAGE_IN"
        runtime="$RUNTIME_IMAGE_IN"
        cgr_ok=0; ib_ok=0
        # Skip login_retry for a registry the caller didn't declare (avoids rate-limit risk).
        attempt_cgr=0; attempt_ib=0
        case "$HARDENED_BASE_REGISTRY" in
          chainguard) attempt_cgr=1 ;;
          ironbank) attempt_ib=1 ;;
          both) attempt_cgr=1; attempt_ib=1 ;;
          *) echo "::error::hardened-base-registry must be 'chainguard', 'ironbank', or 'both' (got '${HARDENED_BASE_REGISTRY}')" >&2; exit 1 ;;
        esac
        if [ "$attempt_cgr" = 1 ] && [ -n "${CGR_PULL_TOKEN:-}" ]; then
          if login_retry cgr.dev "$CGR_PULL_USERNAME" "$CGR_PULL_TOKEN"; then
            echo "Hardened bases: Chainguard (cgr.dev) authenticated"
            cgr_ok=1
          else
            echo "::error::Chainguard (cgr.dev) login failed"
          fi
        fi
        if [ "$attempt_ib" = 1 ] && [ -n "${IRONBANK_TOKEN:-}" ]; then
          if login_retry "$IRONBANK_REGISTRY" "$IRONBANK_USERNAME" "$IRONBANK_TOKEN"; then
            echo "Hardened bases: Iron Bank (${IRONBANK_REGISTRY}) authenticated"
            ib_ok=1
          else
            echo "::error::Iron Bank (${IRONBANK_REGISTRY}) login failed"
          fi
        fi
        # Swap primary to Iron Bank bases only when Chainguard is absent but Iron Bank
        # succeeded; with both authenticated, primary keeps Chainguard and extras pull Iron Bank.
        if [ "$cgr_ok" = 0 ] && [ "$ib_ok" = 1 ]; then
          [ -n "$IB_BUILDER_IMAGE" ] && builder="$IB_BUILDER_IMAGE"
          [ -n "$IB_RUNTIME_IMAGE" ] && runtime="$IB_RUNTIME_IMAGE"
          echo "::notice::CGR_PULL_TOKEN not configured — using Iron Bank (${IRONBANK_REGISTRY}) for primary bases"
        fi
        if [ "$cgr_ok" = 0 ] && [ "$ib_ok" = 0 ]; then
          case "$HARDENED_BASE_REGISTRY" in
            chainguard) hint="add CGR_PULL_TOKEN/CGR_PULL_USERNAME (Chainguard)" ;;
            ironbank) hint="add IRONBANK_TOKEN/IRONBANK_USERNAME (Iron Bank)" ;;
            *) hint="add CGR_PULL_TOKEN/CGR_PULL_USERNAME (Chainguard) and/or IRONBANK_TOKEN/IRONBANK_USERNAME (Iron Bank)" ;;
          esac
          if [ "$REQUIRE_HARDENED_BASES" = 'true' ]; then
            echo "::error::No successful hardened-registry login (hardened-base-registry=${HARDENED_BASE_REGISTRY}) — ${hint}, or set require_hardened_bases: false to accept consumer-specified bases."
            exit 1
          fi
          echo "::warning::Proxy-scan posture: no successful hardened-registry login (hardened-base-registry=${HARDENED_BASE_REGISTRY}) and require_hardened_bases=false — building on consumer-specified bases without a registry login. Vulnerability Scan will cover this gate-reachable image only; a green result is not proof the approved production image is clean."
        fi
        echo "builder_image=$builder" >> "$GITHUB_OUTPUT"
        echo "runtime_image=$runtime" >> "$GITHUB_OUTPUT"
