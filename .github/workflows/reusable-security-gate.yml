# Unified security scan: single PR gate covering all CI spec gates.
#
# A single workflow owns the entire PR gate and reports as the required
# status check, instead of several independent modular scan workflows.
#
# Interface (v0.6: plan/build legs, the scan matrix + thin caller
# surface + fan-in, and the smoke catalog + chart-derived probe): the
# gate derives build facts from the consumer's canonical Compose file via
# `docker buildx bake --print` (the published build plan / BOM) and executes
# each build and scan itself. workflow_call inputs are the 7 v0.6 names
# (compose_file, chart_path, values_local, release, namespace,
# smoke_resources, image_only) + the 4 registry secrets; the v0.5
# scan_image/contract_file/require_hardened_bases and base-image override
# inputs are gone (base images + posture are gate config; see env below).
#
# Structure:
#   plan              configuration pre-flight: v0.6 fail-closed convention
#                     lint (lint_caller.py) on the caller + consumer checkout,
#                     hardened-registry login/failover resolution (shared
#                     bit-for-bit with every build leg), then derive_bom.py
#                     publishes the bake plan + annotated BOM (job summary +
#                     `plan-bom` artifact) and emit_build_matrix.py emits the
#                     build matrix ([{target, tag, dockerfile, context}],
#                     <=10 enforced by the matrix-cap lint) as a job output.
#                     Every scan job needs it.
#   secrets-scan      TruffleHog (parallel after plan)
#   sast-semgrep      Semgrep (parallel, warn-only until baseline)
#   sast-sonarqube    SonarQube ephemeral (parallel, warn-only until baseline)
#   helm-check        helm lint + template + bundled restricted-PSS assertion
#                     on the caller's chart_path/values_local/release inputs
#                     (after plan; blocking unless image_only; the v0.5
#                     consumer ci-secctx hook is dropped with no successor)
#   build             matrixed over the plan job's derived matrix output: one
#                     leg per non-local Compose build target, `bake <target>`
#                     with `--set '*.platform=linux/amd64'` (identical to the
#                     published plan; each leg diffs its re-printed target
#                     entry against the plan-bom artifact), then Syft image
#                     SBOM + `docker save` tar upload, both artifacts named
#                     by target (scan-image-<target> / sbom-image-<target>).
#                     needs: plan only; helm-check runs in parallel with
#                     builds in v0.6.
#   cluster-smoke     kind + provision declared smoke_resources catalog
#                     modules (Ready gate) + load per-leg image tars +
#                     helm install --wait + chart-derived HTTP probe
#                     (needs: build, helm-check); proves the images
#                     boot behind the chart; skipped when
#                     image_only.
#   image-scan        matrixed over the plan job's derived matrix (same
#                     include as build): Trivy + Grype on each leg's
#                     scan-image-<target>/sbom-image-<target> artifacts; the
#                     designated leg (plan's source_sbom_target) also runs
#                     the whole-repo source-SBOM scans (needs: build)
#   security-gate     aggregate pass/fail (needs: all, if: always())
#
# Build artifact handling (mirrors the modular workflows' "transient, runner-
# scoped" approach): the image moves between jobs as an uploaded artifact using
# the runner's built-in token. No GHCR push, no `packages: write`, no per-org
# hardcoding, no cleanup job, so this is fork-safe (fork PRs get a read-only
# token and can't push to a registry, but they can upload artifacts).
#
# Blocking:
#   plan, build, secrets-scan are always blocking.
#   helm-check and cluster-smoke are blocking unless image_only is true
#   (infra/image-only consumers; same skip predicate as the job `if:`).
#   cluster-smoke and image-scan gate their hard-fail on the SECURITY_SCAN_BLOCKING
#   repo variable, but the gate still fails if they are skipped/cancelled/errored
#   (e.g. because the build died); a non-success on any blocking job is a gate
#   failure, so a broken build can never sign off green.
#   sast-semgrep and sast-sonarqube are continue-on-error (warn-only)
#   until the harden baseline lands.

name: Reusable Security Gate

on:
  workflow_call:
    inputs:
      compose_file:
        description: "Path (relative to the consumer repo root) of the canonical Compose file the gate derives build facts from (v0.6). `docker buildx bake --print` on this file is the published build plan; the plan job annotates it into the BOM and emits the build matrix from it."
        type: string
        default: docker-compose.yml
      chart_path:
        description: "Path (relative to the consumer repo root) of the deployable Helm chart helm-check lints/templates and cluster-smoke installs. Required for chart consumers; irrelevant when image_only is true."
        type: string
        default: chart
      values_local:
        description: "Path (relative to the consumer repo root) of the chart values file for local/CI installs (locally-built image tags, pullPolicy: Never). Rendered by helm-check and cluster-smoke on top of the chart's default values."
        type: string
        default: chart/values-local.yaml
      release:
        description: "Helm release name helm-check templates under and cluster-smoke installs as."
        type: string
        default: app
      namespace:
        description: "Kubernetes namespace cluster-smoke creates and installs the release into."
        type: string
        default: app-ci
      smoke_resources:
        description: "CSV of gate-owned smoke catalog module ids (e.g. postgres-pgvector,gateway-crds) cluster-smoke provisions before helm install. Unknown ids are blocked by the smoke-resource-unknown lint rule. Default \"\" provisions none."
        type: string
        default: ""
      image_only:
        description: "When true, skip helm-check and cluster-smoke (and omit them from the Security Gate blocking set), for infra/image-only repos that build and vuln-scan images without a deployable app chart. Default false keeps app callers unchanged (helm + smoke still blocking)."
        type: boolean
        default: false
      publish_images:
        description: "When true, the build job pushes each scan-verified target's image to the ghcr.io/c3-e/images-quarantine/<repo>/<target> quarantine namespace after it builds (tagged pr-<pr-number>-<short-head-sha>), so a later publish-staging-chart.yml run on the same PR can retag it into images-staging by digest without rebuilding. Default false keeps this a pure build-and-scan (no registry write, matching every caller today)."
        type: boolean
        default: false
    secrets:
      CGR_PULL_TOKEN:
        required: false
      CGR_PULL_USERNAME:
        required: false
      IRONBANK_TOKEN:
        required: false
      IRONBANK_USERNAME:
        required: false

permissions:
  contents: read
  pull-requests: write
  packages: write

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gate config (v0.6): base images, Iron Bank registry, and hardened-base
  # posture are gate-owned operator decisions, not caller inputs; the v0.5
  # builder_image/runtime_image/ironbank_*/require_hardened_bases inputs
  # folded into these literals at the v0.6 cutover. These feed the
  # registry-login/failover resolution action (docker login + fail-closed
  # credential check) only. The gate injects no build args; base images
  # are the consumer Dockerfile's own choice. GATE_REQUIRE_HARDENED_BASES
  # is fail-closed by design: no credential pair means no build.
  GATE_BUILDER_IMAGE: cgr.dev/chainguard/python:latest-dev
  GATE_RUNTIME_IMAGE: cgr.dev/chainguard/python:latest
  GATE_IRONBANK_REGISTRY: registry1.dso.mil
  GATE_REQUIRE_HARDENED_BASES: 'true'
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  # --------------------------------------------------------------------------
  # Plan: configuration pre-flight + derivation before anything expensive
  # runs. Fail-closed v0.6 convention lint (lint_caller.py: caller structure,
  # Compose/Dockerfile/chart shape rules) on the consumer checkout, then
  # hardened-registry login/failover resolution, the SAME composite action
  # every build leg runs (docker login + fail-closed credential check; its
  # resolved builder/runtime outputs are not injected into any build),
  # then derive_bom.py publishes the bake plan + annotated
  # BOM and emits the build matrix. Bad caller, nonconforming shapes, or
  # missing required registry secrets never scan.
  # --------------------------------------------------------------------------
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      # v0.6 build matrix from the published bake plan: one entry per
      # non-local Compose build target, [{target, tag, dockerfile, context}].
      # <=10 enforced upstream by the matrix-cap lint rule, and never empty
      # (compose-no-builds blocks first), so no empty-include plan failure.
      # build and image-scan both fan out over this matrix.
      matrix: ${{ steps.emit.outputs.matrix }}
      # The single leg that carries the whole-repo source-SBOM scans: the
      # first target in sorted order (deterministic, never empty). Exactly
      # one image-scan leg matches it.
      source_sbom_target: ${{ steps.emit.outputs.source_sbom_target }}
      # Resolved ONCE here, consumed by every other job via
      # needs.plan.outputs.callee_ref — a single resolver site instead of
      # one duplicated copy per job.
      callee_ref: ${{ steps.calleeref.outputs.ref }}
    steps:
      # Consumer repo (github.repository = the caller's repo).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Resolve which ci-scans ref to lint against: github.job_workflow_sha
      # first (trusted, resolved by GitHub itself), falling back to parsing
      # the caller's own `uses:` pin only when that's empty — the case for
      # every pull_request-triggered call today. Without this the lint
      # validates against main's contract regardless of the pinned ref, the
      # wrong contract the moment they diverge (e.g. piloting an
      # as-yet-unmerged input).
      #
      # Decoy-job hardening: the yq query below takes the FIRST uses: match
      # in the caller file, same as the job_workflow_sha fallback did
      # before it. That is only safe because the new decoy-gate-job lint
      # rule (lint_caller.py) fails the run closed if a caller ever has
      # more than one job whose uses: matches this workflow's filename —
      # eliminating the ambiguity a decoy job would otherwise exploit,
      # rather than trying to guess "the executing job" at runtime
      # (github.job here is THIS reusable workflow's own job id, not the
      # caller's — there is no direct signal for that).
      #
      # Fail-closed: a caller outside this repo that yields no parseable
      # ref AND has no job_workflow_sha fails the run with a named error
      # instead of silently defaulting to main. ci-scans' own fixture
      # callers (this repo's selftest workflows) keep an explicit main
      # fallback, gated on GITHUB_REPOSITORY, since they intentionally
      # exercise this workflow against itself.
      - name: Resolve callee (ci-scans) ref
        id: calleeref
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_WF_SHA: ${{ github.job_workflow_sha }}
        run: |
          set -euo pipefail
          caller="${WORKFLOW_REF#"$GITHUB_REPOSITORY/"}"; caller="${caller%%@*}"
          # Trusted context first. job_workflow_sha is resolved by GitHub
          # itself from the actually-executing job's own pin — immune to a
          # decoy job elsewhere in the caller file. Only fall back to
          # parsing the caller's own text (first uses: match; safe only
          # because decoy-gate-job lint now blocks any caller with more
          # than one candidate) when job_workflow_sha is empty, which is
          # the case for every pull_request-triggered call today.
          ref="$JOB_WF_SHA"
          if [ -z "$ref" ] && [ -f "$caller" ]; then
            ref="$(yq '[.. | select(has("uses")) | .uses | select(test("reusable-security-gate\.yml@"))] | .[0] // "" | split("reusable-security-gate.yml@")[1] // ""' "$caller")"
          fi
          if [ -z "$ref" ]; then
            if [ "$GITHUB_REPOSITORY" = "c3-e/c3cdao-ci-scans" ]; then
              ref="main"
            else
              echo "::error::plan: could not resolve the ci-scans ref this workflow was called at — no parseable 'uses:' pin found in '${caller}', and github.job_workflow_sha is empty. Refusing to silently fall back to main; pin the caller's uses: line to a real ref."
              exit 1
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "::notice::plan: linting against ci-scans ref '$ref'"

      # Callee tooling (lint + derivation scripts, composite actions) at the
      # resolved ref.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: c3-e/c3cdao-ci-scans
          ref: ${{ steps.calleeref.outputs.ref }}
          path: .ci-scans

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      # derive_bom.py shells out to `docker buildx bake --print`.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Login + failover resolution replaces the v0.5 presence-only secrets
      # check: the action fails closed per require-hardened-bases when no
      # credential pair exists. Its resolved builder/runtime outputs are
      # not consumed downstream; the gate injects nothing into any build.
      - name: Login to hardened base registries (Chainguard + Iron Bank)
        id: base-registry
        uses: ./.ci-scans/.github/actions/hardened-registry-login
        with:
          cgr-pull-token: ${{ secrets.CGR_PULL_TOKEN }}
          cgr-pull-username: ${{ secrets.CGR_PULL_USERNAME }}
          ironbank-token: ${{ secrets.IRONBANK_TOKEN }}
          ironbank-username: ${{ secrets.IRONBANK_USERNAME }}
          ironbank-registry: ${{ env.GATE_IRONBANK_REGISTRY }}
          builder-image: ${{ env.GATE_BUILDER_IMAGE }}
          runtime-image: ${{ env.GATE_RUNTIME_IMAGE }}
          require-hardened-bases: ${{ env.GATE_REQUIRE_HARDENED_BASES }}

      # helm-check and cluster-smoke both run `helm dependency build` before
      # rendering the chart; plan's chart lint (lint_caller.py -> helm
      # template) must match, or a chart with a `file://`/remote dependency
      # and no committed `charts/` fails plan lint before it ever reaches
      # helm-check, pushing consumers to commit vendored dependency
      # archives as a workaround. Skipped when
      # image_only or when chart_path doesn't exist yet (chart-missing,
      # a lint_caller.py rule, names that failure instead).
      - name: Set up Helm
        if: ${{ inputs.image_only != true }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      - name: Build chart dependencies (plan-time chart lint)
        if: ${{ inputs.image_only != true }}
        env:
          HELM_CHART_PATH: ${{ inputs.chart_path }}
        run: |
          set -euo pipefail
          if [ -f "${HELM_CHART_PATH}/Chart.yaml" ]; then
            helm dependency build "./${HELM_CHART_PATH}"
          fi

      - name: Lint caller against v0.6 conventions
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          # WORKFLOW_REF: <owner>/<repo>/<path>@<ref>; strip repo prefix + @ref
          caller="${WORKFLOW_REF#"$GITHUB_REPOSITORY/"}"
          caller="${caller%%@*}"
          if [ ! -f "$caller" ]; then
            echo "::error::plan: cannot resolve caller workflow file from workflow_ref='$WORKFLOW_REF' (resolved '$caller')"
            exit 1
          fi
          uv run .ci-scans/scripts/lib/lint_caller.py "$caller" \
            --consumer-root "$GITHUB_WORKSPACE"

      # The published plan is `bake --print` (platform pin is
      # derive_bom-internal) with no base-image --set overrides; each leg
      # re-prints its target and diffs against this artifact.
      - name: Derive bake plan + annotated BOM
        env:
          GATE_COMPOSE_FILE: ${{ inputs.compose_file }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/plan
          uv run .ci-scans/scripts/lib/derive_bom.py \
            "$GITHUB_WORKSPACE/${GATE_COMPOSE_FILE}" \
            --out-dir /tmp/plan | tee /tmp/plan/derive.log

      - name: Publish BOM to job summary
        run: |
          set -euo pipefail
          {
            echo "## Annotated Image BOM (plan)"
            echo
            cat /tmp/plan/derive.log
            echo
            echo '```json'
            python3 -m json.tool /tmp/plan/bom.json
            echo '```'
            echo
            echo "### bake plan (sibling document, --print JSON untouched)"
            echo '```json'
            python3 -m json.tool /tmp/plan/bake-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Build legs download this artifact for the plan/execution parity diff.
      - name: Upload plan artifacts (BOM + bake plan)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: plan-bom
          path: |
            /tmp/plan/bom.json
            /tmp/plan/bake-plan.json
          if-no-files-found: error

      # Single-line JSON so it is safe for GITHUB_OUTPUT. Logic lives in
      # scripts/lib/emit_build_matrix.py (ruff/mypy/pytest-covered), not
      # inline here, mirroring derive_bom.py above.
      - name: Emit build matrix + designated source-SBOM target
        id: emit
        run: uv run .ci-scans/scripts/lib/emit_build_matrix.py /tmp/plan/bake-plan.json

  # --------------------------------------------------------------------------
  # Build: one matrixed job over the plan job's derived matrix
  # ([{target, tag, dockerfile, context}], one leg per non-local Compose
  # build target; no primary/extras distinction). Each leg proves
  # plan/execution parity (re-print its target with the identical --set
  # overrides and diff against the published plan-bom artifact), executes
  # `bake <target>` via docker/bake-action with the platform pin (no
  # base-image arg overrides), verifies the planned tag exists, generates
  # the Syft
  # image SBOM, and uploads the `docker save` tarball; artifacts named by
  # target: scan-image-<target> / sbom-image-<target>. The matrix is never
  # empty (compose-no-builds lint
  # blocks first) and capped at 10 (matrix-cap lint), so no empty-include
  # plan failure is possible. needs: plan only; helm-check runs in parallel
  # with builds in v0.6 (approved job-mapping); fan-in still gates on both.
  # --------------------------------------------------------------------------
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [plan]
    # packages: write lives in the workflow-level permissions: block above,
    # not here. A live regression proved the documented "job-level and
    # workflow-level permissions: must never both be set" convention is not
    # scoped to caller jobs that `uses:` a reusable workflow, as a prior
    # version of this comment assumed — ANY job-level permissions: block
    # coexisting with the workflow-level block in this file produces
    # startup_failure with zero jobs allocated and no error message,
    # confirmed via bisection against a real dispatch run. build is the only
    # job that needs packages: write (to push the quarantine image when
    # publish_images is true); every job in this workflow, including this
    # one, relies solely on the single workflow-level grant.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GATE_COMPOSE_FILE: ${{ inputs.compose_file }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Callee (ci-scans) checkout at the caller-pinned ref: this reusable
      # workflow runs cross-repo, so `uses: ./.github/actions/...` would
      # resolve against the CALLER's tree. Local composite actions are
      # referenced from this .ci-scans checkout instead.
      # Consumes plan's single resolved ref instead of its own resolver
      # copy. No fallback needed here (unlike security-gate / export-bundle)
      # — this job's plain `needs: [plan, ...]` means GitHub never runs it
      # at all unless plan succeeded, so the output is always set by the
      # time this checkout runs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: c3-e/c3cdao-ci-scans
          ref: ${{ needs.plan.outputs.callee_ref }}
          path: .ci-scans

      # Consumer images can be large (WeasyPrint + psql deps). Building one,
      # loading it into Docker, and `docker save`-ing it for the artifact
      # exhausts the hosted runner's ~14 GB free disk. Reclaim ~20 GB.
      - name: Free disk space
        uses: ./.ci-scans/.github/actions/free-disk-space

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      # Hardened-base login + failover resolution: every leg (and the plan
      # job) resolves through this shared action for its docker-login and
      # fail-closed credential check; the resolved builder/runtime outputs
      # are not injected into any build.
      - name: Login to hardened base registries (Chainguard + Iron Bank)
        id: base-registry
        uses: ./.ci-scans/.github/actions/hardened-registry-login
        with:
          cgr-pull-token: ${{ secrets.CGR_PULL_TOKEN }}
          cgr-pull-username: ${{ secrets.CGR_PULL_USERNAME }}
          ironbank-token: ${{ secrets.IRONBANK_TOKEN }}
          ironbank-username: ${{ secrets.IRONBANK_USERNAME }}
          ironbank-registry: ${{ env.GATE_IRONBANK_REGISTRY }}
          builder-image: ${{ env.GATE_BUILDER_IMAGE }}
          runtime-image: ${{ env.GATE_RUNTIME_IMAGE }}
          require-hardened-bases: ${{ env.GATE_REQUIRE_HARDENED_BASES }}

      # bake resolves compose `context:` against the process cwd (spike
      # Finding A), so both the parity re-print and the execution below run
      # from the compose file's directory, same as the plan job's derive.
      - name: Resolve compose location
        id: compose
        run: |
          echo "dir=$(dirname "$GATE_COMPOSE_FILE")" >> "$GITHUB_OUTPUT"
          echo "base=$(basename "$GATE_COMPOSE_FILE")" >> "$GITHUB_OUTPUT"

      - name: Download published plan (plan-bom artifact)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: plan-bom
          path: /tmp/plan

      # Plan/execution parity: re-print this leg's target with the identical
      # target + platform pin (scrubbed env, mirroring derive_bom) and
      # diff the resolved target entry against the published plan. Any drift
      # fails the leg before the build runs; a parity failure means the
      # plan and execution disagree by construction: stop and re-design,
      # do not patch around it.
      - name: Plan/execution parity check
        env:
          TARGET: ${{ matrix.target }}
          COMPOSE_DIR: ${{ steps.compose.outputs.dir }}
          COMPOSE_BASE: ${{ steps.compose.outputs.base }}
        run: |
          set -euo pipefail
          cmd=(docker buildx bake -f "$COMPOSE_BASE"
            --set "*.platform=linux/amd64"
            "$TARGET")
          echo "resolved bake command (leg ${TARGET}): ${cmd[*]}"
          (cd "$COMPOSE_DIR" && env -i PATH="$PATH" HOME="$HOME" "${cmd[@]}" --print) \
            > /tmp/executed-print.json
          jq -S --arg t "$TARGET" '.target[$t]' /tmp/plan/bake-plan.json > /tmp/planned-target.json
          jq -S --arg t "$TARGET" '.target[$t]' /tmp/executed-print.json > /tmp/executed-target.json
          diff /tmp/planned-target.json /tmp/executed-target.json || {
            echo "::error::plan/execution parity drift for target '$TARGET': published plan and execution-time resolution disagree"
            exit 1
          }
          echo "parity OK: planned target entry == executed target entry (${TARGET})"

      - name: Build image via bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b  # v7.3.0
        with:
          # Local source path = the compose file's directory, so compose
          # `context:` resolves exactly as it did for the published plan.
          source: ${{ steps.compose.outputs.dir }}
          files: ${{ steps.compose.outputs.base }}
          targets: ${{ matrix.target }}
          set: |
            *.platform=linux/amd64
            *.cache-from=type=gha,scope=security-scan-${{ matrix.target }}
            *.cache-to=type=gha,mode=max,scope=security-scan-${{ matrix.target }}
          load: true

      - name: Verify bake produced the planned tag
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          if ! docker image inspect "$TAG" >/dev/null 2>&1; then
            echo "::error::bake for target '$TARGET' did not produce the planned tag '$TAG'"
            exit 1
          fi

      # Quarantine publish (publish_images only): this leg's own image, once
      # it has reached this point, has been built via the identical bake
      # invocation the published plan promised (parity-checked above) and is
      # about to be handed to image-scan. Pushing it here — BEFORE any scan
      # result exists — means the quarantine tag is not itself a scan
      # attestation; it is retrieved by digest later ONLY after this same PR's
      # gate run (all of its jobs, including image-scan) has completed, so by
      # the time a publish-staging-chart.yml run retags it the scan already
      # ran against this exact digest. Same GHCR host as every other push in
      # this repo (images-staging, charts-staging), same GITHUB_TOKEN
      # Actions-native login pattern.
      - name: Log in to GHCR (quarantine push)
        if: ${{ inputs.publish_images == true }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3, same pin publish-staging-chart.yml's publish-images-deferred job uses
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QUARANTINE_REF formula is duplicated (not shared via a composite
      # action) in publish-staging-chart.yml's publish-images-deferred job,
      # which reconstructs the identical ref from the same three inputs
      # (repo, PR number, head SHA) to retrieve what this step pushes — see
      # that job's own comment for why this is safe (both sides derive from
      # the same pull_request event fields, nothing passed between runs).
      - name: Push scan-verified image to quarantine
        if: ${{ inputs.publish_images == true }}
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ matrix.tag }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # GHCR requires lowercase OCI path components; github.repository
          # for every consumer in this fleet is already lowercase (org
          # c3-e, lowercase repo names), but lowercase defensively rather
          # than assume that holds forever.
          REPO_LOWER="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          SHORT_HEAD_SHA="${HEAD_SHA:0:7}"
          QUARANTINE_REF="ghcr.io/c3-e/images-quarantine/${REPO_LOWER}/${TARGET}:pr-${PR_NUMBER}-${SHORT_HEAD_SHA}"
          docker tag "$TAG" "$QUARANTINE_REF"
          docker push "$QUARANTINE_REF"
          DIGEST="$(docker buildx imagetools inspect "$QUARANTINE_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "pushed ${TARGET} -> ${QUARANTINE_REF} (digest ${DIGEST})"
          {
            echo "## Quarantine publish: ${TARGET}"
            echo
            echo "- ref: \`${QUARANTINE_REF}\`"
            echo "- digest: \`${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ matrix.tag }}
          format: cyclonedx-json
          output-file: sbom-image-${{ matrix.target }}.json
          artifact-name: sbom-image-${{ matrix.target }}

      - name: Save image to tarball
        env:
          IMG: ${{ matrix.tag }}
        run: docker save "$IMG" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: scan-image-${{ matrix.target }}
          path: image.tar
          if-no-files-found: error
          retention-days: 1

  # --------------------------------------------------------------------------
  # Secrets detection: TruffleHog (diff-aware, verified only)
  #
  # Job name MUST stay "TruffleHog verified-secret scan": the main ruleset
  # requires exactly that status-check context (strict policy + merge queue).
  # Renaming it would leave the required context permanently pending on every
  # future PR (including Dependabot). Do not change without updating the ruleset.
  # --------------------------------------------------------------------------
  secrets-scan:
    name: TruffleHog verified-secret scan
    runs-on: ubuntu-latest
    needs: [plan]  # Parallel with build: occasionally redundant, saves wall-clock time.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          # Full history so the diff base commit is present for range scans.
          fetch-depth: 0

      # Resolve the scan range per event so the scan is diff-aware. Scanning
      # only the PR/merge-queue range (not full history) means a pre-existing
      # verified secret elsewhere in history can't block every future PR once
      # SECURITY_SCAN_BLOCKING=true, the failure mode the modular design avoided.
      - name: Resolve scan range
        id: range
        run: |
          case "${{ github.event_name }}" in
            pull_request)
              echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
              echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
              ;;
            merge_group)
              echo "base=${{ github.event.merge_group.base_sha }}" >> "$GITHUB_OUTPUT"
              echo "head=${{ github.event.merge_group.head_sha }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              # workflow_dispatch / fallback: full-history scan.
              echo "base=" >> "$GITHUB_OUTPUT"
              echo "head=HEAD" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: TruffleHog scan (verified only)
        id: scan
        continue-on-error: true
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70  # v3.95.6
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --only-verified

      - name: Gate on verified secrets
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SECURITY_SCAN_BLOCKING: ${{ vars.SECURITY_SCAN_BLOCKING }}
        run: |
          if [ "$SCAN_OUTCOME" = "failure" ]; then
            if [ "$SECURITY_SCAN_BLOCKING" = "true" ]; then
              echo "::error::TruffleHog found verified secret(s). Failing (SECURITY_SCAN_BLOCKING=true)."
              exit 1
            fi
            echo "::warning::TruffleHog found verified secret(s). Warn-only; set SECURITY_SCAN_BLOCKING=true to enforce."
          else
            echo "No verified secrets found in the scanned range."
          fi

  # --------------------------------------------------------------------------
  # SAST: Semgrep (warn-only until harden baseline)
  # --------------------------------------------------------------------------
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: [plan]  # Parallel with build: occasionally redundant, saves wall-clock time.
    continue-on-error: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Install Semgrep
        run: pip install semgrep==1.159.0

      - name: Run Semgrep scan
        id: scan
        run: |
          # Exit codes: 0 = no findings, 1 = findings found (expected),
          # 2+ = real scanner error. Don't swallow real errors with `|| true`.
          set +e
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-results.json \
            --no-git-ignore \
            .
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ge 2 ]; then
            echo "::error::Semgrep failed with exit code $EXIT_CODE"
            exit "$EXIT_CODE"
          fi

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: semgrep-results
          path: semgrep-results.json
          if-no-files-found: warn

      - name: Gate on ERROR-severity findings (warn-only)
        run: |
          set -uo pipefail
          if [ ! -f semgrep-results.json ]; then
            echo "::warning::Semgrep results artifact missing; cannot count ERROR findings"
            exit 1
          fi
          if ! ERRORS=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep-results.json); then
            echo "::warning::Semgrep results JSON unreadable; cannot count ERROR findings"
            exit 1
          fi
          if [ "$ERRORS" -gt 0 ]; then
            echo "::warning::Semgrep found ${ERRORS} ERROR-severity finding(s). Warn-only; change exit 0 to exit 1 below to enforce."
            exit 0  # change to `exit 1` to enforce the gate
          fi
          echo "No ERROR-severity Semgrep findings."

  # --------------------------------------------------------------------------
  # SAST: SonarQube ephemeral (warn-only until baseline)
  # --------------------------------------------------------------------------
  sast-sonarqube:
    name: SAST (SonarQube ephemeral)
    runs-on: ubuntu-latest
    needs: [plan]  # Parallel with build: occasionally redundant, saves wall-clock time.
    timeout-minutes: 30
    continue-on-error: true
    services:
      sonarqube:
        # Hardened base: Iron Bank SonarQube (matches the modular sonarqube.yml
        # CI posture, not a public image). Uses the IRONBANK pull secrets the
        # base repo has. On forks without them the service can't pull and this
        # warn-only (continue-on-error) job errors without blocking the gate.
        image: registry1.dso.mil/ironbank/sonarsource/sonarqube/sonarqube:9.9-community
        credentials:
          username: ${{ secrets.IRONBANK_USERNAME }}
          password: ${{ secrets.IRONBANK_TOKEN }}
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      # `packages/`/`apps/` is a monorepo-shaped convention, not universal;
      # a flat single-app repo (source directories at the repo root) has
      # neither, and sonar-scanner exits 2 ("folder does not exist") before
      # ever scanning. Scope to whichever of the two exist at the
      # repo root; fall back to the whole tree only when neither does, so
      # monorepo consumers keep their existing (narrower) scan surface.
      - name: Resolve sonar.sources
        id: sonar-sources
        run: |
          set -euo pipefail
          dirs=()
          [ -d packages ] && dirs+=("packages/")
          [ -d apps ] && dirs+=("apps/")
          if [ "${#dirs[@]}" -eq 0 ]; then
            sources="."
          else
            IFS=,; sources="${dirs[*]}"; unset IFS
          fi
          echo "sources=$sources" >> "$GITHUB_OUTPUT"
          echo "::notice::sast-sonarqube: sonar.sources=$sources"

      - name: Wait for SonarQube
        run: |
          for i in $(seq 1 60); do
            sq_status=$(curl -fsS http://127.0.0.1:9000/api/system/status 2>/dev/null \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
            [ "$sq_status" = "UP" ] && echo "SonarQube UP after $((i*5))s" && break
            echo "[$i/60] status: $sq_status"; sleep 5
          done
          [ "$sq_status" = "UP" ] || { echo "::error::SonarQube did not start"; exit 1; }

      - name: Provision project and token
        id: sonar
        run: |
          NEW_PASS="ci-admin-${GITHUB_RUN_ID}"
          curl -fsS -u admin:admin -X POST \
            "http://127.0.0.1:9000/api/users/change_password?login=admin&previousPassword=admin&password=${NEW_PASS}"
          TOKEN=$(curl -fsS -u "admin:${NEW_PASS}" -X POST \
            "http://127.0.0.1:9000/api/user_tokens/generate?name=ci-${GITHUB_RUN_ID}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run sonar-scanner
        uses: sonarsource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e  # v8.2.0
        env:
          SONAR_TOKEN: ${{ steps.sonar.outputs.token }}
          SONAR_HOST_URL: http://127.0.0.1:9000
        with:
          args: >
            -Dsonar.projectKey=security-scan
            -Dsonar.sources=${{ steps.sonar-sources.outputs.sources }}
            -Dsonar.exclusions=**/node_modules/**,**/.pnpm-store/**

      # Wait for the Compute Engine task to finish before reading the gate;
      # otherwise project_status can return a stale or empty result from a prior
      # (or not-yet-computed) analysis. Mirrors the modular sonarqube.yml.
      - name: Wait for analysis task to complete
        env:
          SONAR_TOKEN: ${{ steps.sonar.outputs.token }}
        run: |
          if [ ! -f .scannerwork/report-task.txt ]; then
            echo "::error::report-task.txt not produced; analysis did not run"
            exit 1
          fi
          TASK_URL=$(grep '^ceTaskUrl=' .scannerwork/report-task.txt | cut -d'=' -f2-)
          if [ -z "$TASK_URL" ]; then
            echo "::error::ceTaskUrl missing from report-task.txt"; cat .scannerwork/report-task.txt; exit 1
          fi
          for i in $(seq 1 60); do
            STATUS=$(curl -fsS -u "${SONAR_TOKEN}:" "$TASK_URL" | python3 -c "import sys,json; print(json.load(sys.stdin)['task']['status'])")
            case "$STATUS" in
              SUCCESS) echo "Analysis complete after $((i*5))s"; break ;;
              FAILED|CANCELED) echo "::error::Analysis ended with status $STATUS"; exit 1 ;;
              *) echo "[$i/60] Analysis status: $STATUS"; sleep 5 ;;
            esac
            [ "$i" = "60" ] && { echo "::error::Analysis did not complete within 5 minutes"; exit 1; }
          done

      - name: Quality gate check (warn-only)
        id: qualitygate
        env:
          SONAR_TOKEN: ${{ steps.sonar.outputs.token }}
        run: |
          # Read the gate for the specific analysisId we just computed, not the
          # project's latest, so the result matches this run.
          ANALYSIS_ID=$(grep '^ceTaskId=' .scannerwork/report-task.txt | cut -d'=' -f2- \
            | xargs -I{} curl -fsS -u "${SONAR_TOKEN}:" "http://127.0.0.1:9000/api/ce/task?id={}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['task'].get('analysisId',''))")
          if [ -n "$ANALYSIS_ID" ]; then
            curl -fsS -u "${SONAR_TOKEN}:" \
              "http://127.0.0.1:9000/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}" > quality-gate.json
          else
            curl -fsS -u "${SONAR_TOKEN}:" \
              "http://127.0.0.1:9000/api/qualitygates/project_status?projectKey=security-scan" > quality-gate.json
          fi
          result=$(python3 -c "import sys,json; print(json.load(open('quality-gate.json'))['projectStatus']['status'])")
          echo "Quality gate: $result"
          if [ "$result" = "ERROR" ]; then
            echo "::warning::SonarQube quality gate FAILED. Warn-only; change exit 0 to exit 1 to enforce."
            exit 0  # change to `exit 1` to enforce the gate
          fi

      # 90-day compliance artifact (the prescribed evidence the modular
      # sonarqube.yml uploaded; retained for audit).
      - name: Upload SonarQube compliance artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sonarqube-${{ github.run_id }}
          path: |
            quality-gate.json
            .scannerwork/report-task.txt
          retention-days: 90
          if-no-files-found: warn
          include-hidden-files: true

  # --------------------------------------------------------------------------
  # Helm chart validity: blocking unless image_only. Chart location comes
  # from the caller's chart_path/values_local/release inputs (v0.6 thin
  # surface). The consumer ci-secctx hook is dropped with no successor
  # (approved job-mapping): the bundled restricted-PSS assertion below is
  # the gate-owned coverage.
  # --------------------------------------------------------------------------
  helm-check:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    needs: [plan]  # Parallel with build: occasionally redundant, saves wall-clock time.
    if: ${{ inputs.image_only != true }}
    env:
      HELM_CHART_PATH: ${{ inputs.chart_path }}
      HELM_VALUES_FILE: ${{ inputs.values_local }}
      HELM_RELEASE_NAME: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      - name: Build chart dependencies
        run: helm dependency build "./${HELM_CHART_PATH}"

      - name: helm lint
        run: helm lint "./${HELM_CHART_PATH}" -f "${HELM_VALUES_FILE}"

      - name: helm template (render check)
        run: helm template "${HELM_RELEASE_NAME}" "./${HELM_CHART_PATH}" -f "${HELM_VALUES_FILE}" > /tmp/rendered-chart.yaml

      # Restricted-PSS assertion on the rendered releases, a machine-checkable
      # re-scan of the templated securityContext rows. Ported from the modular
      # helm-validate.yml (which this workflow replaces) so that pod-security
      # enforcement isn't lost.
      # Consumes plan's single resolved ref instead of its own resolver
      # copy. No fallback needed here (unlike security-gate / export-bundle)
      # — this job's plain `needs: [plan, ...]` means GitHub never runs it
      # at all unless plan succeeded, so the output is always set by the
      # time this checkout runs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: c3-e/c3cdao-ci-scans
          ref: ${{ needs.plan.outputs.callee_ref }}
          path: .ci-scans

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      # The bundled restricted-PSS assertion is GATE POLICY: it always runs
      # in-gate (tamper-proof: a consumer cannot edit it out of a file they
      # own; the v0.5 consumer ci-secctx hook is dropped with no successor).
      - name: Assert rendered pod-security controls (bundled, gate policy)
        run: |
          set -uo pipefail
          if ! command -v uv >/dev/null 2>&1; then
            echo "::error::helm-check requires uv on the runner for the bundled restricted-PSS assertion; setup-uv did not provide it"
            exit 1
          fi
          uv run .ci-scans/scripts/lib/assert_restricted_pss.py /tmp/rendered-chart.yaml

  # --------------------------------------------------------------------------
  # Cluster smoke: kind + catalog provisioning + helm install + derived probe.
  # helm-check (lint/template) is a static render; it can't catch a chart that
  # renders clean but crash-loops on boot (bad env, failed migration, broken
  # entrypoint). Flow: create kind cluster -> load every per-leg image
  # tar -> apply the declared smoke_resources catalog modules and gate on
  # their readiness (a timeout fails naming the module, BEFORE any helm
  # install) -> helm install --wait -> probe the chart-derived HTTP target
  # (derive_smoke_target.py over the local-values render, same semantics the
  # smoke-target lint enforced in plan, so a lint-clean chart always derives).
  # Warn-only unless SECURITY_SCAN_BLOCKING.
  # --------------------------------------------------------------------------
  cluster-smoke:
    name: Cluster Smoke (kind + helm + health)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # plan added directly: needs.plan.outputs.callee_ref below requires
    # plan in this job's OWN needs: list, even though it was already an
    # implicit, transitive dependency via build/helm-check.
    needs: [plan, build, helm-check]
    if: |
      always() &&
      inputs.image_only != true &&
      needs.build.result == 'success' &&
      needs.helm-check.result == 'success'
    outputs:
      smoke_ok: ${{ steps.smoke_outcome.outputs.ok }}
    env:
      # Gate config: kind cluster name is an operator decision (was the
      # v0.5 cluster_name input).
      CLUSTER: app-ci
      NAMESPACE: ${{ inputs.namespace }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # kind node + smoke-env DB + the loaded backend image strain the runner's
      # ~14 GB free disk; reclaim unused toolchains first (mirrors the build job).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h /

      # Callee (ci-scans) checkout: catalog module manifests + the
      # smoke-target derivation script live in the gate repo, not the
      # consumer's tree (same cross-repo pattern as plan/build/helm-check).
      # Consumes plan's single resolved ref instead of its own resolver
      # copy. No fallback needed here (unlike security-gate / export-bundle)
      # — this job's plain `needs: [plan, ...]` means GitHub never runs it
      # at all unless plan succeeded, so the output is always set by the
      # time this checkout runs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: c3-e/c3cdao-ci-scans
          ref: ${{ needs.plan.outputs.callee_ref }}
          path: .ci-scans

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      # Every per-leg image tar: build uploads scan-image-<target>
      # per matrix leg; each downloads into its own directory.
      - name: Download per-leg image artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: scan-image-*
          path: /tmp/images

      - name: Load images into local daemon
        run: |
          set -euo pipefail
          : > /tmp/loaded-tags.txt
          for tar in /tmp/images/scan-image-*/image.tar; do
            docker load -i "$tar" | tee -a /tmp/load.log
          done
          grep -oE '^Loaded image: .+' /tmp/load.log | sed 's/^Loaded image: //' \
            | sort -u > /tmp/loaded-tags.txt
          [ -s /tmp/loaded-tags.txt ]
          echo "loaded $(wc -l < /tmp/loaded-tags.txt | tr -d ' ') image tag(s)"

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0
        with:
          cluster_name: ${{ env.CLUSTER }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      - name: provision catalog + helm deploy
        id: smoke
        # Warn-only: advisory unless SECURITY_SCAN_BLOCKING=true. Step outcome is
        # recorded below so security-gate can fail closed even when this step
        # continues on error (job result stays success).
        continue-on-error: ${{ vars.SECURITY_SCAN_BLOCKING != 'true' }}
        env:
          SMOKE_RESOURCES: ${{ inputs.smoke_resources }}
          HELM_CHART_PATH: ${{ inputs.chart_path }}
          HELM_RELEASE_NAME: ${{ inputs.release }}
          HELM_VALUES_LOCAL_FILE: ${{ inputs.values_local }}
        run: |
          set -uo pipefail
          fail() { echo "::warning::cluster-smoke: $1"; exit 1; }

          while IFS= read -r tag; do
            kind load docker-image "${tag}" --name "${CLUSTER}" \
              || fail "kind load failed for ${tag}"
          done < /tmp/loaded-tags.txt

          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          # Gate-owned smoke_resources catalog modules: apply each
          # declared module and gate on its readiness BEFORE any helm
          # install. Ids were validated upstream by the
          # smoke-resource-unknown lint rule; module id -> manifest file
          # maps dash to underscore.
          provision_module() {
            local module="$1"
            # Defense in depth: the smoke-resource-unknown lint already
            # blocked unknown ids in plan, but this shell must not turn a
            # crafted id into a path (['/'] or '..') under any circumstance.
            case "$module" in
              (*[!a-z0-9-]*|"") echo "invalid smoke resource id '${module}'"; return 1 ;;
            esac
            local manifest=".ci-scans/scripts/lib/smoke_catalog/${module//-/_}.yaml"
            [ -f "$manifest" ] || { echo "no catalog manifest for '${module}'"; return 1; }
            kubectl apply -n "${NAMESPACE}" -f "$manifest" || return 1
            if grep -q '^kind: CustomResourceDefinition' "$manifest"; then
              kubectl wait --for=condition=Established -f "$manifest" \
                --timeout=120s || return 1
            fi
            if grep -qE '^kind: (StatefulSet|Deployment)' "$manifest"; then
              local ready=false
              for _ in $(seq 1 30); do
                if kubectl -n "${NAMESPACE}" wait --for=condition=Ready pod \
                     -l "app.kubernetes.io/name=${module}" --timeout=6s \
                     >/dev/null 2>&1; then
                  ready=true; break
                fi
                sleep 2
              done
              if [ "$ready" != true ]; then
                kubectl -n "${NAMESPACE}" get pods,statefulsets \
                  -l "app.kubernetes.io/name=${module}" -o wide || true
                kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp | tail -20 || true
                return 1
              fi
            fi
          }
          IFS=',' read -ra modules <<< "${SMOKE_RESOURCES}"
          for module in "${modules[@]}"; do
            module="$(echo "$module" | tr -d '[:space:]')"
            [ -n "$module" ] || continue
            provision_module "$module" \
              || fail "smoke resource '${module}' failed readiness before helm install"
            echo "module ready: ${module}"
          done

          helm dependency build "./${HELM_CHART_PATH}" || fail "helm dependency build failed"

          # Rendered once here (local-values render); consumed both by the
          # helm.sh/hook: test detection step below and, for hook-less
          # charts, by the fallback smoke-target derivation step.
          helm template "${HELM_RELEASE_NAME}" "./${HELM_CHART_PATH}" \
            -f "${HELM_VALUES_LOCAL_FILE}" > /tmp/rendered-chart.yaml \
            || fail "helm template failed for hook detection / smoke-target derivation"

          helm install "${HELM_RELEASE_NAME}" "./${HELM_CHART_PATH}" \
            -n "${NAMESPACE}" \
            -f "${HELM_VALUES_LOCAL_FILE}" \
            --wait \
            --timeout 5m || {
              echo "=== helm install failed: cluster diagnostics ==="
              kubectl -n "${NAMESPACE}" get pods,jobs -o wide || true
              kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp | tail -30 || true
              for p in $(kubectl -n "${NAMESPACE}" get pods -o name 2>/dev/null); do
                echo "--- describe ${p} ---"; kubectl -n "${NAMESPACE}" describe "${p}" | tail -25 || true
                echo "--- logs ${p} ---"; kubectl -n "${NAMESPACE}" logs "${p}" --all-containers --tail=40 || true
              done
              fail "helm install failed"
            }
          echo "helm install OK"

      # Static check on the render `smoke` already produced above (NOT a
      # re-render) — TEMPORARY migration scaffolding: this is the fleet
      # migration to `helm test` hooks in progress, not a permanent
      # dual-path design. Tracked for deletion, together with the two
      # branches below and their sibling in composed-smoke.yml and the
      # matching exemption in scripts/lib/lint_rules/chart.py's
      # smoke_target rule, once every onboarded pilot has adopted a hook.
      - name: "Detect helm.sh/hook: test resources"
        id: hook-detect
        if: steps.smoke.outcome == 'success'
        run: |
          set -uo pipefail
          # Real YAML-aware parse, not a text grep — same fix pattern as
          # the callee-ref-resolver's move off grep+sed. A plain-text
          # `grep -qE 'helm\.sh/hook:.*test'` misses a quoted annotation
          # key (`"helm.sh/hook": test`), since YAML quoting is a
          # syntax-level artifact that a real parser discards but a text
          # grep still sees. This checks the PARSED
          # metadata.annotations["helm.sh/hook"] value on every document
          # in the multi-doc rendered chart, split on commas per Helm's
          # real hook-annotation semantics (`helm.sh/hook:
          # pre-install,test` is a valid multi-hook resource), for a
          # value that equals "test" exactly (not a substring match —
          # Helm 2's legacy `test-success`/`test-failure` values must NOT
          # match Helm 3's `test`).
          hook_count=$(yq eval-all '
              [select(
                (.metadata.annotations["helm.sh/hook"] // ""
                  | split(",")
                  | map(sub("^\s+|\s+$"; "")))
                | any_c(. == "test")
              )] | length
            ' /tmp/rendered-chart.yaml) || {
            echo "::warning::cluster-smoke: helm.sh/hook detection (yq parse) failed"
            exit 1
          }
          if [ "${hook_count}" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "helm.sh/hook: test resource(s) detected in rendered chart (${hook_count})"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "no helm.sh/hook: test resource detected; falling back to the derived-target probe"
          fi

      - name: helm test (hook-based health check)
        id: helm-test
        if: steps.smoke.outcome == 'success' && steps.hook-detect.outputs.found == 'true'
        continue-on-error: ${{ vars.SECURITY_SCAN_BLOCKING != 'true' }}
        env:
          HELM_RELEASE_NAME: ${{ inputs.release }}
        run: |
          set -uo pipefail
          helm test "${HELM_RELEASE_NAME}" -n "${NAMESPACE}" --logs

      # TEMPORARY migration scaffolding: this derived-target port-forward
      # + curl fallback exists only for charts that have not yet adopted
      # a helm.sh/hook: test resource. It is tracked for deletion, along
      # with the hook-detect step above, composed-smoke.yml's own
      # equivalent branch, and the matching exemption in
      # scripts/lib/lint_rules/chart.py's smoke_target rule, once every
      # onboarded pilot has migrated to a hook — see docs/CI-CONTRACT.md.
      # Code below this comment is byte-for-byte the pre-migration logic,
      # just moved into its own conditional step.
      - name: Chart-derived HTTP probe (no-hook fallback)
        id: probe-fallback
        if: steps.smoke.outcome == 'success' && steps.hook-detect.outputs.found == 'false'
        continue-on-error: ${{ vars.SECURITY_SCAN_BLOCKING != 'true' }}
        run: |
          set -uo pipefail
          fail() { echo "::warning::cluster-smoke: $1"; exit 1; }

          # Chart-derived probe target: derive from the local-values
          # render, the same Service-backed HTTP readiness semantics the
          # smoke-target lint rule enforced in plan, so a lint-clean chart
          # always derives exactly one target.
          target_json=$(uv run .ci-scans/scripts/lib/derive_smoke_target.py \
            /tmp/rendered-chart.yaml) || fail "smoke-target derivation failed"
          echo "derived smoke target: ${target_json}"
          PROBE_SVC=$(echo "$target_json" | jq -re .service) || fail "derived target missing service"
          PROBE_PORT=$(echo "$target_json" | jq -re .port) || fail "derived target missing port"
          PROBE_PATH=$(echo "$target_json" | jq -re .path) || fail "derived target missing path"

          # Fixed high local port: the derived Service port may be <1024
          # (e.g. 80), which the unprivileged runner user cannot bind.
          kubectl -n "${NAMESPACE}" port-forward "svc/${PROBE_SVC}" \
            "18080:${PROBE_PORT}" >/tmp/pf.log 2>&1 &
          pf_pid=$!
          sleep 6
          code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:18080${PROBE_PATH}" || echo 000)
          kill "${pf_pid}" 2>/dev/null || true
          echo "GET ${PROBE_PATH} via svc/${PROBE_SVC}:${PROBE_PORT} -> ${code}"
          [ "${code}" = "200" ] || fail "${PROBE_PATH} returned ${code}, expected 200"
          echo "probe 200: smoke OK"

      - name: Record smoke step outcome
        id: smoke_outcome
        if: always()
        run: |
          ok=false
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            if [ "${{ steps.hook-detect.outputs.found }}" = "true" ]; then
              [ "${{ steps.helm-test.outcome }}" = "success" ] && ok=true
            else
              [ "${{ steps.probe-fallback.outcome }}" = "success" ] && ok=true
            fi
          fi
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "cluster-smoke step outcome=${{ steps.smoke.outcome }} hook_found=${{ steps.hook-detect.outputs.found }} helm_test=${{ steps.helm-test.outcome }} probe_fallback=${{ steps.probe-fallback.outcome }} smoke_ok=$ok"

  # --------------------------------------------------------------------------
  # Image scan: one matrixed job over the plan job's derived matrix, the
  # same include the build job fans out over (never empty; <=10 via the
  # matrix-cap lint). Every leg runs the shared image-side scans (Trivy
  # image, Grype image, Grype image-SBOM) against its leg's per-target
  # artifacts (scan-image-<target> / sbom-image-<target>); the designated
  # leg (plan's source_sbom_target) additionally generates the whole-repo
  # source SBOM and runs the source-SBOM Trivy/Grype scans (run once).
  # Same SECURITY_SCAN_BLOCKING exit-code semantics on every leg.
  # --------------------------------------------------------------------------
  image-scan:
    name: Vulnerability Scan ${{ matrix.target }} (Trivy + Grype)
    runs-on: ubuntu-latest
    # plan is needed only to reference its matrix / source_sbom_target outputs.
    needs: [plan, build]
    if: needs.build.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Source SBOM is whole-repo and runs once, designated leg only.
      - name: Generate source SBOM (pnpm + uv)
        if: ${{ matrix.target == needs.plan.outputs.source_sbom_target }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom-source.json
          artifact-name: sbom-source

      # Callee (ci-scans) checkout at the caller-pinned ref: this reusable
      # workflow runs cross-repo, so `uses: ./.github/actions/...` would
      # resolve against the CALLER's tree. Local composite actions are
      # referenced from this .ci-scans checkout instead.
      # Consumes plan's single resolved ref instead of its own resolver
      # copy. No fallback needed here (unlike security-gate / export-bundle)
      # — this job's plain `needs: [plan, ...]` means GitHub never runs it
      # at all unless plan succeeded, so the output is always set by the
      # time this checkout runs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: c3-e/c3cdao-ci-scans
          ref: ${{ needs.plan.outputs.callee_ref }}
          path: .ci-scans

      # Default scanner configs + image load + Trivy image + Grype image +
      # Grype image-SBOM (also creates .trivyignore/.grype.yaml defaults the
      # designated leg's source-SBOM scans below rely on).
      - name: Image vulnerability scan (Trivy + Grype)
        uses: ./.ci-scans/.github/actions/image-vuln-scan
        with:
          image-tag: ${{ matrix.tag }}
          image-artifact-name: scan-image-${{ matrix.target }}
          sbom-artifact-name: sbom-image-${{ matrix.target }}
          trivy-severity: ${{ env.TRIVY_SEVERITY }}
          blocking: ${{ vars.SECURITY_SCAN_BLOCKING }}

      - name: Trivy scan (source SBOM)
        if: ${{ matrix.target == needs.plan.outputs.source_sbom_target }}
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          scan-type: sbom
          scan-ref: sbom-source.json
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: ${{ vars.SECURITY_SCAN_BLOCKING == 'true' && '1' || '0' }}
          trivyignores: .trivyignore

      # Trivy is not run on the image SBOM (Syft-SBOM incompatibility); the
      # direct Trivy image scan above covers those packages.

      - name: Grype scan (source SBOM)
        if: ${{ matrix.target == needs.plan.outputs.source_sbom_target }}
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        with:
          sbom: sbom-source.json
          severity-cutoff: high
          fail-build: ${{ vars.SECURITY_SCAN_BLOCKING == 'true' }}
          output-format: table
          config: .grype.yaml

  # --------------------------------------------------------------------------
  # Export bundle: convenience-only re-packaging of this run's evidence
  # artifacts into ONE combined download. Every image-scan leg already
  # uploads its own security-export-<service>-<short-sha> bundle (RUNBOOK.md
  # appendix I); a repo with N built services means N separate artifacts to
  # click through in the Actions UI (there is no "download all" button)
  # plus sbom-source and plan-bom. This job downloads exactly those
  # artifacts — pattern-matched, since the per-service names aren't known
  # statically here (image-scan is matrixed over the plan-derived targets)
  # — and re-uploads them as ONE security-export-full-<short-sha> artifact.
  # Purely additive: the per-service artifacts still upload exactly as
  # image-vuln-scan always did; this job only copies them.
  #
  # NOT a gate: if: always(), and every download below is pattern-scoped so
  # a zero-match run logs "0 artifact(s) downloaded" and succeeds rather
  # than throwing (verified against the pinned download-artifact action's
  # source: a `pattern:` filter of zero matches returns cleanly; only a
  # `name:`-based single-artifact lookup throws on a miss). Deliberately
  # left out of security-gate's needs: below so an assembly failure (e.g.
  # no image-scan legs ran) can never fail the required check.
  #
  # On pull_request-triggered runs only, this job also posts (or, on a
  # re-run for the same PR, updates in place via a hidden HTML marker) a
  # single PR comment summarizing each built service's Trivy/Grype
  # High+Critical counts and VEX source, plus a link to the run page,
  # the consolidated artifact's `gh run download` line, and a read-only
  # pending-VEX-disposition report (findings not covered by any VEX
  # statement, split into "remediate" vs "no fix, VEX candidate" by the
  # scanners' own fix metadata — RUNBOOK.md Appendix I). All these steps
  # are `continue-on-error: true`; a posting failure can never fail this
  # job, and this job is not in security-gate's needs: regardless.
  # --------------------------------------------------------------------------
  export-bundle:
    name: Consolidated Security Export Bundle
    runs-on: ubuntu-latest
    needs: [plan, image-scan]
    if: always()
    steps:
      - name: Resolve short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # One pattern covers all three documented export-bundle inputs
      # (security-export-<service>-<short-sha> per leg, sbom-source,
      # plan-bom); merge-multiple: false keeps every artifact in its own
      # subdirectory so two services' metadata.json (etc.) can't collide.
      # Deliberately excludes semgrep-results/sonarqube-*/raw
      # scan-image-*/sbom-image-*/docker build-cache blobs: duplicates
      # already inside the per-service bundles, or outside the documented
      # export-bundle contract.
      - name: Download this run's export-bundle artifacts
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: "{security-export-*,sbom-source,plan-bom}"
          path: ${{ runner.temp }}/security-export-full
          merge-multiple: false

      - name: Report bundle contents
        if: always()
        run: |
          echo "download step outcome: ${{ steps.download.outcome }}"
          find "${{ runner.temp }}/security-export-full" -maxdepth 2 2>/dev/null | sort || true

      # if-no-files-found: warn (not error) — a zero-artifact bundle (e.g.
      # plan failed before publishing plan-bom, and no image-scan leg ran)
      # is a legitimate empty-evidence outcome for a convenience job, not a
      # failure worth surfacing loudly.
      - name: Upload combined security export bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: security-export-full-${{ steps.sha.outputs.short }}
          path: ${{ runner.temp }}/security-export-full
          if-no-files-found: warn

      # ------------------------------------------------------------------
      # Pending-VEX-disposition report (pull_request only): cross-repo
      # checkout of ci-scans' own tooling, same bootstrap every other job
      # pays to reach scripts/lib/*.py (plan/helm-check/cluster-smoke/
      # image-scan). Read-only: pending_disposition_report.py never
      # writes .openvex/, never authors a statement — it only diffs the
      # bundle's own trivy-image.json/grype-image.json against
      # vex-applied.openvex.json and splits what's left by the scanners'
      # own fix metadata. See docs/RUNBOOK.md Appendix I.
      # ------------------------------------------------------------------
      # Consumes plan's single resolved ref. Same explicit fallback chain
      # as security-gate below (this job is also if: always(), so plan may
      # have failed before setting its output) — low-risk here too: this
      # checkout only feeds a read-only, continue-on-error VEX report,
      # never security-gate's pass/fail.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        if: github.event_name == 'pull_request'
        with:
          repository: c3-e/c3cdao-ci-scans
          ref: ${{ needs.plan.outputs.callee_ref || github.job_workflow_sha || 'main' }}
          path: .ci-scans

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
        if: github.event_name == 'pull_request'

      - name: Build pending-disposition report
        id: pending-disposition
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -uo pipefail
          out_file="${{ runner.temp }}/pending-disposition.md"
          uv run .ci-scans/scripts/lib/pending_disposition_report.py \
            "${{ runner.temp }}/security-export-full" > "$out_file"
          echo "out_file=$out_file" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------
      # PR comment: scan-results summary (RUNBOOK.md Appendix I). Only on
      # pull_request-triggered runs (github.event.pull_request.number is
      # only meaningful there; merge_group/schedule/workflow_dispatch/push
      # never reach these two steps). Reads the bundle this job just
      # assembled above — per-service trivy-image.json/grype-image.json
      # (High+Critical counts) and metadata.json (VEX source) — plus the
      # combined artifact name and the run page link (there is no
      # standalone authenticated-free artifact download URL; the run's
      # Artifacts list is the actual download surface). Commentary only:
      # both steps are continue-on-error and this job is not in
      # security-gate's needs:, so a comment-posting failure (e.g. a
      # permissions edge case) can never affect the required check.
      # ------------------------------------------------------------------
      - name: Build PR scan-summary comment body
        id: pr-summary
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -uo pipefail
          bundle_dir="${{ runner.temp }}/security-export-full"
          body_file="${{ runner.temp }}/pr-comment-body.md"
          {
            echo "<!-- security-export-summary -->"
            echo "### Security export summary"
            echo
            echo "| Service | Trivy High+Critical | Grype High+Critical | VEX source |"
            echo "| --- | --- | --- | --- |"
            found=false
            for dir in "$bundle_dir"/security-export-*/; do
              [ -d "$dir" ] || continue
              found=true
              svc="$(basename "$dir")"
              svc="${svc#security-export-}"
              svc="${svc%-*}"  # strip the trailing -<short-sha> (7 hex chars, never dash-bearing)
              trivy_count="n/a"
              grype_count="n/a"
              vex_source="unknown"
              if [ -f "${dir}trivy-image.json" ]; then
                trivy_count=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' "${dir}trivy-image.json" 2>/dev/null) || trivy_count="n/a"
              fi
              if [ -f "${dir}grype-image.json" ]; then
                grype_count=$(jq '[.matches[]? | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")] | length' "${dir}grype-image.json" 2>/dev/null) || grype_count="n/a"
              fi
              if [ -f "${dir}metadata.json" ]; then
                vex_source=$(jq -r '.vex.source // "unknown"' "${dir}metadata.json" 2>/dev/null) || vex_source="unknown"
              fi
              echo "| ${svc} | ${trivy_count} | ${grype_count} | ${vex_source} |"
            done
            if [ "$found" = false ]; then
              echo "| _no per-service export bundles found in this run_ | | | |"
            fi
            echo
            echo "**Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (Artifacts list, including the consolidated bundle, lives there)"
            echo
            echo "**Consolidated artifact:** \`security-export-full-${{ steps.sha.outputs.short }}\`"
            echo
            echo '```bash'
            echo "gh run download ${{ github.run_id }} -n security-export-full-${{ steps.sha.outputs.short }}"
            echo '```'
            echo
            if [ -n "${{ steps.pending-disposition.outputs.out_file }}" ] && [ -f "${{ steps.pending-disposition.outputs.out_file }}" ]; then
              cat "${{ steps.pending-disposition.outputs.out_file }}"
            fi
          } > "$body_file"
          echo "body_file=$body_file" >> "$GITHUB_OUTPUT"

      # Find-or-create against the hidden marker, not the PR's comment
      # history position, so re-runs on the same PR update one comment
      # instead of spamming a new one per push. Uses the pull-requests:
      # write permission already granted at the workflow level (no
      # per-job permissions: override — same as every other job in this
      # file, all of which rely on that single workflow-level block); per
      # GitHub's token-permission model a PR's issue-comment write is
      # governed by the pull-requests scope (not issues), even though the
      # REST path is /issues/{number}/comments, so no additional scope is
      # needed.
      - name: Post or update PR scan-summary comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BODY_FILE: ${{ steps.pr-summary.outputs.body_file }}
        run: |
          set -uo pipefail
          if [ -z "${BODY_FILE:-}" ] || [ ! -f "$BODY_FILE" ]; then
            echo "::warning::pr-summary comment body missing (prior step failed?); skipping post"
            exit 0
          fi
          api="${GITHUB_API_URL:-https://api.github.com}"
          marker='<!-- security-export-summary -->'

          existing_id=""
          page=1
          while :; do
            resp=$(curl -fsS \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100&page=${page}") || break
            match=$(echo "$resp" | jq -r --arg marker "$marker" '[.[] | select(.body | contains($marker))][0].id // empty')
            if [ -n "$match" ]; then existing_id="$match"; break; fi
            count=$(echo "$resp" | jq 'length' 2>/dev/null || echo 0)
            [ "${count:-0}" -lt 100 ] && break
            page=$((page + 1))
          done

          payload=$(jq -Rs '{body: .}' < "$BODY_FILE")

          if [ -n "$existing_id" ]; then
            echo "updating existing security-export-summary comment id=${existing_id}"
            curl -fsS -X PATCH \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/repos/${REPO}/issues/comments/${existing_id}" \
              -d "$payload" >/dev/null
          else
            echo "posting new security-export-summary comment"
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api}/repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -d "$payload" >/dev/null
          fi

  # --------------------------------------------------------------------------
  # Security Gate: aggregate required check
  # --------------------------------------------------------------------------
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [plan, build, secrets-scan, sast-semgrep, sast-sonarqube, helm-check, cluster-smoke, image-scan]
    if: always()
    steps:
      # Consumes plan's single resolved ref instead of its own resolver
      # copy. Explicit fallback chain since this job runs if: always() —
      # plan may have failed before setting its output.
      # github.job_workflow_sha is empty on pull_request-triggered calls
      # (the same gap fixed in plan), so main is the last resort; safe
      # specifically here because this job only aggregates needs.*.result
      # (never processes untrusted build artifacts), and a failed plan
      # already makes the overall gate fail regardless of which evaluator
      # ref runs.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          repository: c3-e/c3cdao-ci-scans
          ref: ${{ needs.plan.outputs.callee_ref || github.job_workflow_sha || 'main' }}
          path: .ci-scans

      - name: Evaluate scan results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IMAGE_ONLY: ${{ inputs.image_only }}
          SECURITY_SCAN_BLOCKING: ${{ vars.SECURITY_SCAN_BLOCKING }}
        run: python3 .ci-scans/scripts/lib/evaluate_security_gate.py
