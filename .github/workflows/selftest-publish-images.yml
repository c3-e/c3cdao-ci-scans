name: Selftest — Publish Images (quarantine round trip)

# WHY THIS FILE EXISTS (dry-run prerequisite for the real publish job):
#
# publish-staging-chart.yml's publish-images-deferred job only has a
# workflow_call trigger, and its own `if:` condition hard-requires
# `github.event.pull_request.merged == true` (plus `inputs.publish_images ==
# true` and a base-branch check). A workflow_dispatch event can NEVER
# satisfy that condition — `github.event.pull_request` simply does not
# exist under workflow_dispatch, there is no pull_request event context to
# read `.merged` off of. There is no supported way to fake or force that
# condition from a manual dispatch without either:
#
#   (a) editing the real job's own `if:` to special-case a dry-run mode —
#       rejected: that would permanently weaken the real job's fail-closed
#       trigger guard just to make manual testing more convenient, exactly
#       backwards from this repo's own fail-closed posture ("never a green
#       run with a missing artifact," extended here to "never a loosened
#       gate for convenience"); or
#   (b) synthesizing a fake merged-PR event context — GitHub Actions does
#       not support this for workflow_dispatch, and it would be fragile/
#       unsupported even if some hack could approximate it.
#
# So this is a SEPARATE, workflow_dispatch-only workflow that exercises the
# FULL round trip of the digest-verified quarantine publish mechanism (see
# docs/PUBLISH-STAGING-CHART.md "Digest-verified quarantine publish"):
#
#   1. quarantine-push: builds the fixture image (tests/fixtures/hello-image/
#      Dockerfile) and tags+pushes it to images-quarantine, the identical
#      "docker tag <tag> $QUARANTINE_REF && docker push $QUARANTINE_REF"
#      mechanic reusable-security-gate.yml's build job performs when
#      inputs.publish_images is true.
#   2. retag: reconstructs the SAME quarantine ref from the SAME formula
#      publish-images-deferred uses, runs `docker buildx imagetools
#      inspect` against it (the identical fail-closed existence check —
#      exercising the missing-image failure path is out of scope for a
#      green selftest, but the success path here IS the real code, not a
#      simulation of it), then `docker buildx imagetools create --tag`
#      to retag it into images-staging by digest — no rebuild.
#   3. verify: independently inspects the final images-staging digest and
#      asserts it is byte-for-byte identical to the quarantine digest
#      captured in step 1 — the actual claim this whole mechanism makes.
#
# The destination tags are deliberately throwaway, unmistakably-selftest
# paths (images-quarantine/selftest/hello-image:... and
# images-staging/selftest/hello-image:... keyed by this run's run_id) so
# they can never be confused with, or collide with, a real pilot's
# quarantine or staging artifact.
#
# Note: the real jobs' hardened-registry-login steps (require_hardened_bases)
# are intentionally NOT exercised here — the fixture Dockerfile is FROM
# scratch (no hardened base to pull), so there is nothing for that step to
# prove that isn't already proven by the identical docker/login-action-style
# mechanics already exercised for the GHCR login below (same credential-pair
# pattern, just a different registry endpoint).

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  quarantine-push:
    name: 1. build + push to quarantine (mirrors reusable-security-gate.yml's build job)
    runs-on: ubuntu-latest
    outputs:
      quarantine_ref: ${{ steps.push.outputs.quarantine_ref }}
      quarantine_digest: ${{ steps.push.outputs.quarantine_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4, same pin publish-staging-chart.yml uses everywhere in that file
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3, same pin publish-images-deferred / reusable-security-gate.yml's build job use

      - name: Log in to GHCR (Actions-native GITHUB_TOKEN, not a personal PAT)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3, same pin publish-images-deferred / reusable-security-gate.yml's build job use
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Local build + load: this selftest builds the fixture directly with
      # docker buildx (not docker/bake-action) since the round trip under
      # test starts AFTER a local tag exists — how that local tag was
      # produced (bake vs. plain buildx build) is orthogonal to the
      # quarantine-push/retag/verify mechanics this workflow proves.
      - name: Build fixture image (local, GREETING build arg exercises the same jq passthrough shape)
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --build-arg GREETING=hello-from-selftest-quarantine-roundtrip \
            -t selftest/hello-image:local \
            -f tests/fixtures/hello-image/Dockerfile \
            tests/fixtures/hello-image

      # Identical mechanic to reusable-security-gate.yml build job's own
      # "Push scan-verified image to quarantine" step: tag the locally-built
      # image into the quarantine ref, push it, then capture its digest.
      - name: Tag + push to quarantine, capture digest
        id: push
        run: |
          set -euo pipefail
          QUARANTINE_REF="ghcr.io/c3-e/images-quarantine/selftest/hello-image:workflow-dispatch-${{ github.run_id }}"
          docker tag selftest/hello-image:local "$QUARANTINE_REF"
          docker push "$QUARANTINE_REF"
          DIGEST="$(docker buildx imagetools inspect "$QUARANTINE_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "quarantine_ref=${QUARANTINE_REF}" >> "$GITHUB_OUTPUT"
          echo "quarantine_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "pushed ${QUARANTINE_REF} @ ${DIGEST}"

  retag:
    name: 2. verify + retag into images-staging (mirrors publish-images-deferred)
    runs-on: ubuntu-latest
    needs: [quarantine-push]
    outputs:
      staging_ref: ${{ steps.retag.outputs.staging_ref }}
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR (Actions-native GITHUB_TOKEN, not a personal PAT)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Identical fail-closed existence check to publish-images-deferred's
      # own "Verify quarantine image exists" step.
      - name: Verify quarantine image exists
        id: verify
        env:
          QUARANTINE_REF: ${{ needs.quarantine-push.outputs.quarantine_ref }}
        run: |
          set -euo pipefail
          if ! docker buildx imagetools inspect "$QUARANTINE_REF" >/tmp/imagetools-inspect.log 2>&1; then
            cat /tmp/imagetools-inspect.log
            echo "::error::quarantine image missing or expired; selftest cannot proceed"
            exit 1
          fi
          DIGEST="$(docker buildx imagetools inspect "$QUARANTINE_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # Identical retag mechanic to publish-images-deferred's own "Retag
      # quarantine image into images-staging" step — registry-side
      # manifest/blob copy, no rebuild.
      - name: Retag into images-staging by digest
        id: retag
        env:
          QUARANTINE_REF: ${{ needs.quarantine-push.outputs.quarantine_ref }}
          DIGEST: ${{ steps.verify.outputs.digest }}
        run: |
          set -euo pipefail
          STAGING_REF="ghcr.io/c3-e/images-staging/selftest/hello-image:workflow-dispatch-${{ github.run_id }}"
          docker buildx imagetools create --tag "$STAGING_REF" "${QUARANTINE_REF}@${DIGEST}"
          echo "staging_ref=${STAGING_REF}" >> "$GITHUB_OUTPUT"
          echo "retagged ${QUARANTINE_REF}@${DIGEST} -> ${STAGING_REF}"

  verify-digest-match:
    name: 3. verify final digest == quarantine digest
    runs-on: ubuntu-latest
    needs: [quarantine-push, retag]
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR (Actions-native GITHUB_TOKEN, not a personal PAT)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The actual claim under test: the digest landing in images-staging
      # is byte-for-byte the SAME digest that was quarantined and scanned —
      # not a rebuild, not a re-derivation.
      - name: Assert digests match
        env:
          QUARANTINE_DIGEST: ${{ needs.quarantine-push.outputs.quarantine_digest }}
          STAGING_REF: ${{ needs.retag.outputs.staging_ref }}
        run: |
          set -euo pipefail
          STAGING_DIGEST="$(docker buildx imagetools inspect "$STAGING_REF" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "quarantine digest: ${QUARANTINE_DIGEST}"
          echo "staging digest:    ${STAGING_DIGEST}"
          if [ "$QUARANTINE_DIGEST" != "$STAGING_DIGEST" ]; then
            echo "::error::digest mismatch: images-staging digest does not match the quarantined, scan-verified image"
            exit 1
          fi
          echo "MATCH: images-staging digest == images-quarantine digest (no rebuild occurred)"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Selftest: publish images (quarantine round trip)"
            echo
            echo "- quarantine: \`${{ needs.quarantine-push.outputs.quarantine_ref }}\` @ \`${{ needs.quarantine-push.outputs.quarantine_digest }}\`"
            echo "- staging: \`${{ needs.retag.outputs.staging_ref }}\`"
            echo "- this is a throwaway selftest artifact, never a real pilot image"
          } >> "$GITHUB_STEP_SUMMARY"
