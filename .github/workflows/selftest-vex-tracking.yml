# Selftest — vex-tracking OCI read/merge/write (T-3 remediation canary)
#
# WHY THIS FILE EXISTS:
#
# T-3 adds a mechanism (image-vuln-scan/action.yml's new steps +
# scripts/lib/vex_tracking.py) with no local test harness for its own
# GitHub Actions wiring — pytest can exercise vex_tracking.py's merge()
# function directly, but chart-path threading, the oras setup/pull/push
# steps, and step ordering relative to the Trivy/Grype JSON exports can
# only be proven by a real dispatch. An initial build of T-3 shipped with
# eight bugs unit tests never caught, because none of them live in
# merge() — they were all in this untested glue (chart-path never wired,
# step ordering, oras never installed, an unauthenticated pull returning
# "denied" instead of a clean 404 on a brand-new namespace, oras's
# path-traversal guard on any absolute -o destination, and a push that
# baked the absolute source path into the artifact's own title
# annotation). Every one of them surfaced only once this selftest
# actually ran for real — this file is the fix: same "crafted input,
# real tool invocation, assert on real output" shape as
# selftest-publish-images.yml, applied to this mechanism.
#
# Reuses selftest-fixtures/vex-visibility/medium-cve-image/ (an
# intentionally old, real, publicly-pullable base image with genuine
# accumulated CVEs — no hand-authored JSON standing in for scanner
# output) — this fixture is also IG-0a's planned deliverable
# (task-sequence.md §2, T-1's gate), built once and reused by both.
#
# Destination is ghcr.io/c3-e/vex-tracking/selftest-vex-tracking-pilot-v2 —
# an unmistakably-selftest PILOT name (deliberately different from this
# fixture's own directory basename, medium-cve-image, proving Chart.yaml's
# .name field wins over basename() — the exact T-6/ppubs bug shape) that
# can never collide with a real pilot's tracking record.
#
# Run twice (two separate workflow_dispatch invocations) to prove
# first_issued preservation across runs — the same two-real-runs shape
# IG-0b (task-sequence.md §2) requires before trusting T-3.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  vex-tracking-canary:
    name: Build fixture + exercise image-vuln-scan's vex-tracking chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build fixture image (real, old, genuinely-vulnerable base — not a hand-authored scan result)
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            -t selftest/vex-canary:local \
            -f selftest-fixtures/vex-visibility/medium-cve-image/Dockerfile \
            selftest-fixtures/vex-visibility/medium-cve-image

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: selftest/vex-canary:local
          format: cyclonedx-json
          output-file: sbom-image-selftest.json
          artifact-name: sbom-image-selftest

      - name: Save image to tarball
        run: docker save selftest/vex-canary:local -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: scan-image-selftest
          path: image.tar
          if-no-files-found: error
          retention-days: 1

      # Chart directory basename is deliberately "chart-fixture-dir",
      # unrelated to the .name field below — proves the PILOT the
      # vex-tracking mechanism derives is read from Chart.yaml's own
      # declared name, never from basename(chart_path) (T-6's bug, fixed
      # independently here per T-3's own Technical Notes).
      - name: Create mismatched-basename chart fixture
        run: |
          set -euo pipefail
          mkdir -p /tmp/chart-fixture-dir
          cat > /tmp/chart-fixture-dir/Chart.yaml <<'EOF'
          apiVersion: v2
          name: selftest-vex-tracking-pilot-v2
          version: 0.1.0
          EOF
          echo "chart dir basename: $(basename /tmp/chart-fixture-dir)"
          echo "Chart.yaml .name:   $(yq eval '.name' /tmp/chart-fixture-dir/Chart.yaml)"

      - name: Run image-vuln-scan (exercises the full vex-tracking chain)
        uses: ./.github/actions/image-vuln-scan
        with:
          image-tag: selftest/vex-canary:local
          image-artifact-name: scan-image-selftest
          sbom-artifact-name: sbom-image-selftest
          trivy-severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          blocking: "false"
          chart-path: /tmp/chart-fixture-dir

      - name: Verify vex-tracking record landed under the Chart.yaml-derived PILOT path
        run: |
          set -euo pipefail
          # oras was installed by image-vuln-scan's own "Set up oras CLI"
          # step above (composite-action steps run in this same job/PATH —
          # not a separate job), so it's already on PATH here.
          oras pull "ghcr.io/c3-e/vex-tracking/selftest-vex-tracking-pilot-v2:latest" -o /tmp/vex-verify --allow-path-traversal
          echo "--- merged vex-tracking record ---"
          cat /tmp/vex-verify/vex-tracking.json
          echo
          echo "--- statement count ---"
          jq '.statements | length' /tmp/vex-verify/vex-tracking.json
          echo "--- confirms both scanners contributed (Trivy + Grype VulnerabilityID/name shapes both present, not just one) ---"
          jq -r '.statements[].vulnerability.name' /tmp/vex-verify/vex-tracking.json | sort -u

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Selftest: vex-tracking (T-3 remediation canary)"
            echo
            echo "- PILOT resolved from Chart.yaml, chart dir basename was deliberately different"
            echo "- registry ref: \`ghcr.io/c3-e/vex-tracking/selftest-vex-tracking-pilot-v2:latest\`"
            echo "- this is a throwaway selftest artifact, never a real pilot's tracking record"
          } >> "$GITHUB_STEP_SUMMARY"
