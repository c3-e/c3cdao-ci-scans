name: Composed Multi-Pilot Smoke Test

# Unlike reusable-security-gate.yml's cluster-smoke (one chart, built THIS run), this job
# pulls N pilots' charts/images from a PRIOR publish-staging-chart.yml run's staging registry.

on:
  workflow_call:
    inputs:
      pilots:
        description: >-
          JSON array, one entry per pilot subchart to compose:
          [{"name":"rms-copilot","chart_ref":"oci://ghcr.io/c3-e/charts-staging/rms-copilot:0.0.0-mech.94.c6a53e6",
          "images":[{"name":"backend","values_path":"rms-copilot.fullstack-template.backend.image"},
                     {"name":"psp7-gateway-frontend","values_path":"rms-copilot.fullstack-template.frontend.image"}]}].
          chart_ref is the exact OCI ref already pinned in the caller's own
          Chart.yaml (same string, not re-derived) — this workflow does not
          decide pilot versions, the caller's Chart.yaml already did. Each
          images[] entry's name is the <image-name> path segment under
          images-staging/<pilot>/<image-name> (see
          c3-e/c3cdao-ci-scans's docs/PUBLISH-STAGING-CHART.md); values_path
          is the dotted values key (repository/tag siblings) the caller's
          own helm install overrides, e.g. via --set-string.
        type: string
        required: true
      umbrella_values:
        description: >-
          Repo-root-relative path(s) to the caller's values file(s),
          newline- or comma-separated. Each is passed to `helm upgrade
          --install` as its own `-f`, in the given order (last wins on
          conflict) — same semantics as stacking `-f` flags by hand. This
          lets a caller layer a small CI-only overlay (e.g. placeholder
          credentials or a smoke-fixture DB wiring that must NOT leak into
          the same file's local/prod defaults) on top of its base
          values.yaml, without duplicating it. Default is unchanged
          single-file behavior for existing callers.
        type: string
        default: values.yaml
      namespace:
        description: "Kubernetes namespace this workflow creates and installs the composed release into."
        type: string
        default: umbrella-ci
      smoke_resources:
        description: >-
          CSV of gate-owned smoke catalog module ids — reuses the SAME
          catalog reusable-security-gate.yml's own cluster-smoke job already
          owns (scripts/lib/smoke_catalog/*.yaml). Default covers the
          umbrella's two known backing-service needs: a shared Postgres
          fixture (ADR-08) and the Gateway API core CRDs every pilot's
          chart-emitted HTTPRoute needs to install against.
        type: string
        default: postgres-pgvector,gateway-crds

permissions:
  contents: read
  packages: read # only read: this workflow PULLS staging artifacts, never publishes

jobs:
  compose-smoke:
    name: Composed Smoke (kind + N pilots + health)
    runs-on: ubuntu-latest
    # Longer than the single-pilot 30m budget (reusable-security-gate.yml's
    # cluster-smoke) — N chart/image pulls + N installs + N probes, not 1.
    timeout-minutes: 45
    steps:
      - name: Checkout caller (the umbrella)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      # Trusted job_workflow_sha takes priority over parsing the caller's text; no
      # decoy-job lint rule exists yet here, but this still fails closed instead of defaulting.
      - name: Resolve callee (ci-scans) ref
        id: calleeref
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_WF_SHA: ${{ github.job_workflow_sha }}
        run: |
          set -euo pipefail
          caller="${WORKFLOW_REF#"$GITHUB_REPOSITORY/"}"; caller="${caller%%@*}"
          ref="$JOB_WF_SHA"
          if [ -z "$ref" ] && [ -f "$caller" ]; then
            ref="$(yq '[.. | select(has("uses")) | .uses | select(test("composed-smoke\.yml@"))] | .[0] // "" | split("composed-smoke.yml@")[1] // ""' "$caller")"
          fi
          if [ -z "$ref" ]; then
            if [ "$GITHUB_REPOSITORY" = "c3-e/c3cdao-ci-scans" ]; then
              ref="main"
            else
              echo "::error::composed-smoke: could not resolve the ci-scans ref this workflow was called at — no parseable 'uses:' pin found in '${caller}', and github.job_workflow_sha is empty. Refusing to silently fall back to main; pin the caller's uses: line to a real ref."
              exit 1
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: c3-e/c3cdao-ci-scans
          ref: ${{ steps.calleeref.outputs.ref }}
          path: .ci-scans

      # Login before any OCI pull — Helm 3.8+ reads the same docker credential store
      # login-action writes, so one login covers both `helm pull` and `docker pull` below.
      - name: Log in to GHCR (read-only pull, covers both helm and docker OCI clients)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate pilots input
        id: pilots
        env:
          PILOTS_JSON: ${{ inputs.pilots }}
        run: |
          set -euo pipefail
          echo "$PILOTS_JSON" | jq -e 'type == "array" and length > 0' >/dev/null \
            || { echo "::error::pilots input must be a non-empty JSON array"; exit 1; }
          echo "$PILOTS_JSON" | jq -c '.[]' > /tmp/pilots.jsonl
          jq -r '.name' /tmp/pilots.jsonl > /tmp/pilot-names.txt
          echo "pilot count: $(wc -l < /tmp/pilots.jsonl | tr -d ' ')"

      # Not `helm dependency build .`: that fails closed on this repo's local/packaged deps.
      - name: Pull every OTHER OCI-pinned dependency
        run: |
          set -euo pipefail
          mkdir -p charts
          yq -o=json '.dependencies' Chart.yaml | jq -c '.[]' | while IFS= read -r dep; do
            name="$(jq -r '.name' <<<"$dep")"
            version="$(jq -r '.version' <<<"$dep")"
            repository="$(jq -r '.repository // ""' <<<"$dep")"
            if grep -qxF "$name" /tmp/pilot-names.txt; then
              continue  # this run's own pilots[] pull (below) wins instead
            fi
            if [ -z "$repository" ] || [ "$repository" = "null" ]; then
              echo "skipping ${name}: local/packaged dependency, already in the checked-out tree"
              continue
            fi
            echo "pulling ${name} @ ${version} <- ${repository}"
            helm pull "${repository}/${name}" --version "${version}" -d charts/
          done

      # Non-pilot deps must be disabled, or `helm install --wait` hangs waiting on a
      # sibling pilot's Deployment whose image was never loaded into this kind cluster.
      - name: Derive non-pilot disable flags
        run: |
          set -euo pipefail
          : > /tmp/disable-flags.txt
          yq -r '.dependencies[].name' Chart.yaml | while IFS= read -r dep; do
            if ! grep -qxF "$dep" /tmp/pilot-names.txt; then
              printf -- '--set\n%s.enabled=false\n' "$dep" >> /tmp/disable-flags.txt
            fi
          done
          echo "disabled $(($(wc -l < /tmp/disable-flags.txt | tr -d ' ') / 2)) non-pilot dependency(ies)"

      # Untarred directly (not left as a .tgz) so `helm dependency build` below sees a
      # chart directory instead of re-fetching these OCI-pinned deps itself.
      - name: Pull every pilot's staging chart
        run: |
          set -euo pipefail
          mkdir -p charts
          while IFS= read -r pilot; do
            name="$(jq -r '.name' <<<"$pilot")"
            chart_ref="$(jq -r '.chart_ref' <<<"$pilot")"
            echo "pulling ${name} <- ${chart_ref}"
            rm -rf "charts/${name}"
            helm pull "$chart_ref" --untar --untardir charts/
          done < /tmp/pilots.jsonl
          ls -la charts/

      # Same kind-load technique reusable-security-gate.yml's cluster-smoke uses for
      # built images, just sourced from a registry pull instead of a same-run build.
      - name: Pull every declared image ref
        id: pullimages
        run: |
          set -euo pipefail
          : > /tmp/pulled-tags.txt
          while IFS= read -r pilot; do
            name="$(jq -r '.name' <<<"$pilot")"
            chart_ref="$(jq -r '.chart_ref' <<<"$pilot")"
            # images-staging shares the same <pilot>/<tag> as chart_ref — derive the tag
            # from it rather than requiring a second, redundant field.
            tag="${chart_ref##*:}"
            jq -c '.images[]' <<<"$pilot" | while IFS= read -r image; do
              image_name="$(jq -r '.name' <<<"$image")"
              ref="ghcr.io/c3-e/images-staging/${name}/${image_name}:${tag}"
              echo "pulling ${ref}"
              docker pull "$ref"
              echo "$ref" >> /tmp/pulled-tags.txt
            done
          done < /tmp/pilots.jsonl
          echo "pulled $(wc -l < /tmp/pulled-tags.txt | tr -d ' ') image ref(s)"

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: umbrella-ci

      - name: Load pulled images into kind
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            kind load docker-image "${ref}" --name umbrella-ci \
              || { echo "::error::kind load failed for ${ref}"; exit 1; }
          done < /tmp/pulled-tags.txt

      # Same provision_module() logic as reusable-security-gate.yml's cluster-smoke step
      # (readiness-gated before helm install) — reused directly, not forked into a second copy.
      - name: Provision smoke_resources catalog (shared with reusable-security-gate.yml)
        env:
          SMOKE_RESOURCES: ${{ inputs.smoke_resources }}
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -uo pipefail
          fail() { echo "::error::compose-smoke: $1"; exit 1; }

          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          provision_module() {
            local module="$1"
            case "$module" in
              (*[!a-z0-9-]*|"") echo "invalid smoke resource id '${module}'"; return 1 ;;
            esac
            local manifest=".ci-scans/scripts/lib/smoke_catalog/${module//-/_}.yaml"
            [ -f "$manifest" ] || { echo "no catalog manifest for '${module}'"; return 1; }
            kubectl apply -n "${NAMESPACE}" -f "$manifest" || return 1
            if grep -q '^kind: CustomResourceDefinition' "$manifest"; then
              kubectl wait --for=condition=Established -f "$manifest" \
                --timeout=120s || return 1
            fi
            if grep -qE '^kind: (StatefulSet|Deployment)' "$manifest"; then
              local ready=false
              for _ in $(seq 1 30); do
                if kubectl -n "${NAMESPACE}" wait --for=condition=Ready pod \
                     -l "app.kubernetes.io/name=${module}" --timeout=6s \
                     >/dev/null 2>&1; then
                  ready=true; break
                fi
                sleep 2
              done
              if [ "$ready" != true ]; then
                kubectl -n "${NAMESPACE}" get pods,statefulsets \
                  -l "app.kubernetes.io/name=${module}" -o wide || true
                kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp | tail -20 || true
                return 1
              fi
            fi
          }
          IFS=',' read -ra modules <<< "${SMOKE_RESOURCES}"
          for module in "${modules[@]}"; do
            module="$(echo "$module" | tr -d '[:space:]')"
            [ -n "$module" ] || continue
            provision_module "$module" \
              || fail "smoke resource '${module}' failed readiness before helm install"
            echo "module ready: ${module}"
          done

      # Mirrors the umbrella's own Makefile LOCAL_IMAGE_PILOTS pattern, pointed at
      # images-staging/* tags instead of :local.
      - name: Derive helm install flags
        id: installflags
        run: |
          set -euo pipefail
          : > /tmp/install-flags.txt
          while IFS= read -r pilot; do
            name="$(jq -r '.name' <<<"$pilot")"
            chart_ref="$(jq -r '.chart_ref' <<<"$pilot")"
            tag="${chart_ref##*:}"
            jq -c '.images[]' <<<"$pilot" | while IFS= read -r image; do
              image_name="$(jq -r '.name' <<<"$image")"
              values_path="$(jq -r '.values_path' <<<"$image")"
              repo="ghcr.io/c3-e/images-staging/${name}/${image_name}"
              {
                echo "--set-string"
                echo "${values_path}.repository=${repo}"
                echo "--set-string"
                echo "${values_path}.tag=${tag}"
                echo "--set-string"
                echo "${values_path}.pullPolicy=IfNotPresent"
              } >> /tmp/install-flags.txt
            done
          done < /tmp/pilots.jsonl
          echo "derived $(($(wc -l < /tmp/install-flags.txt | tr -d ' ') / 6)) pilot image override group(s)"

      - name: helm install the umbrella chart (with image overrides)
        env:
          NAMESPACE: ${{ inputs.namespace }}
          UMBRELLA_VALUES: ${{ inputs.umbrella_values }}
        run: |
          set -euo pipefail
          mapfile -t flags < <(cat /tmp/disable-flags.txt /tmp/install-flags.txt)
          # UMBRELLA_VALUES may be a single path or a newline/comma-separated list — each
          # becomes its own -f, in order, so a caller can layer a CI-only overlay on top.
          mapfile -t value_files < <(printf '%s' "${UMBRELLA_VALUES}" | tr ',' '\n' | sed '/^[[:space:]]*$/d')
          value_flags=()
          for vf in "${value_files[@]}"; do
            value_flags+=("-f" "$vf")
          done
          helm upgrade --install umbrella-ci . \
            -n "${NAMESPACE}" \
            "${value_flags[@]}" \
            "${flags[@]}" \
            --wait --timeout 10m || {
              echo "=== helm install failed: cluster diagnostics ==="
              kubectl -n "${NAMESPACE}" get pods,jobs -o wide || true
              kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp | tail -30 || true
              for p in $(kubectl -n "${NAMESPACE}" get pods -o name 2>/dev/null); do
                echo "--- describe ${p} ---"; kubectl -n "${NAMESPACE}" describe "${p}" | tail -25 || true
                # `kubectl logs --all-containers` does not reliably cover initContainers —
                # name every container and initContainer explicitly instead.
                for c in $(kubectl -n "${NAMESPACE}" get "${p}" \
                    -o jsonpath='{range .spec.initContainers[*]}{.name}{"\n"}{end}{range .spec.containers[*]}{.name}{"\n"}{end}' \
                    2>/dev/null); do
                  echo "--- logs ${p} -c ${c} ---"
                  kubectl -n "${NAMESPACE}" logs "${p}" -c "${c}" --tail=100 || true
                  echo "--- logs ${p} -c ${c} (previous attempt, if any) ---"
                  kubectl -n "${NAMESPACE}" logs "${p}" -c "${c}" --previous --tail=100 2>/dev/null || true
                done
              done
              exit 1
            }

      # TEMPORARY migration scaffolding (tracked for deletion once every pilot adopts a
      # hook): hook-bearing pilots run through helm test instead of the per-target curl loop.
      - name: Partition composed pilots by helm.sh/hook test resources
        id: partition
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          : > /tmp/hook-pilots.txt
          : > /tmp/nohook-pilots.txt
          while IFS= read -r pilot; do
            name="$(jq -r '.name' <<<"$pilot")"
            helm template umbrella-ci "charts/${name}" -n "${NAMESPACE}" > "/tmp/rendered-${name}.yaml"
            # Real YAML-aware parse, not a text grep — quoted annotation keys break a grep,
            # and hook values must match "test" exactly to exclude Helm 2's legacy values.
            hook_count=$(yq eval-all '
                [select(
                  (.metadata.annotations["helm.sh/hook"] // ""
                    | split(",")
                    | map(sub("^\s+|\s+$"; "")))
                  | any_c(. == "test")
                )] | length
              ' "/tmp/rendered-${name}.yaml") || {
              echo "::error::helm.sh/hook detection (yq parse) failed for pilot '${name}'"
              exit 1
            }
            if [ "${hook_count}" -gt 0 ]; then
              echo "${name}" >> /tmp/hook-pilots.txt
            else
              echo "${name}" >> /tmp/nohook-pilots.txt
            fi
          done < /tmp/pilots.jsonl
          echo "hook-bearing pilot(s): $(wc -l < /tmp/hook-pilots.txt | tr -d ' ')"
          echo "hook-less pilot(s): $(wc -l < /tmp/nohook-pilots.txt | tr -d ' ')"

      - name: helm test hook-bearing pilots (single release-wide run)
        id: helm-test
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -uo pipefail
          if [ ! -s /tmp/hook-pilots.txt ]; then
            echo "no hook-bearing pilots this run; skipping helm test"
            exit 0
          fi
          echo "hook-bearing pilots covered by this run: $(paste -sd, /tmp/hook-pilots.txt)"
          helm test umbrella-ci -n "${NAMESPACE}" --logs || {
            echo "=== helm test failed: hook pod diagnostics ==="
            kubectl -n "${NAMESPACE}" get pods -o wide || true
            kubectl -n "${NAMESPACE}" get networkpolicies -o yaml || true
            kubectl -n "${NAMESPACE}" get events --sort-by=.lastTimestamp | tail -30 || true
            while IFS= read -r name; do
              pod="$(kubectl -n "${NAMESPACE}" get pods -l "helm.sh/hook=test" \
                -o jsonpath="{range .items[?(@.metadata.labels['app.kubernetes.io/instance']=='umbrella-ci')]}{.metadata.name}{'\n'}{end}" \
                2>/dev/null | grep -F "$name" || true)"
              [ -n "$pod" ] || continue
              while IFS= read -r p; do
                echo "--- describe pod/${p} ---"; kubectl -n "${NAMESPACE}" describe "pod/${p}" || true
                for c in $(kubectl -n "${NAMESPACE}" get "pod/${p}" \
                    -o jsonpath='{range .spec.containers[*]}{.name}{"\n"}{end}' 2>/dev/null); do
                  echo "--- logs pod/${p} -c ${c} ---"
                  kubectl -n "${NAMESPACE}" logs "pod/${p}" -c "${c}" --tail=100 || true
                done
              done <<< "$pod"
            done < /tmp/hook-pilots.txt
            exit 1
          }

      # Probes EVERY Service-backed candidate a pilot's chart yields, not just one — a
      # multi-component pilot is healthy only when every exposed endpoint answers.
      - name: Write per-pilot target probe script
        run: |
          cat > /tmp/probe_targets.py <<'PYEOF'
          import sys, json, yaml
          sys.path.insert(0, ".ci-scans/scripts/lib")
          from lint_rules.chart import smoke_candidates

          docs = [d for d in yaml.safe_load_all(open(sys.argv[1])) if isinstance(d, dict)]
          backed, unbacked = smoke_candidates(docs)
          if not backed:
              detail = "; ".join(unbacked) if unbacked else "no httpGet readinessProbe declared"
              print(f"no Service-backed HTTP readiness target found ({detail})", file=sys.stderr)
              sys.exit(1)
          for c in backed:
              print(json.dumps({"service": c["service"], "port": c["port"], "path": c["path"]}, sort_keys=True))
          PYEOF
          python3 -c "import ast; ast.parse(open('/tmp/probe_targets.py').read())" \
            || { echo "::error::generated probe script has a syntax error"; cat -A /tmp/probe_targets.py; exit 1; }

      - name: Health-check every composed pilot
        id: health
        env:
          NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -uo pipefail
          fail_any=0
          : > /tmp/pilot-results.tsv

          # Hook-bearing pilots were already covered by the release-wide helm test above;
          # record their result here without re-probing.
          if [ -s /tmp/hook-pilots.txt ]; then
            while IFS= read -r name; do
              chart_ref="$(jq -r --arg n "$name" 'select(.name == $n) | .chart_ref' /tmp/pilots.jsonl)"
              if [ "${{ steps.helm-test.outcome }}" = "success" ]; then
                printf '%s\t%s\tOK (helm test)\tn/a\n' "$name" "$chart_ref" >> /tmp/pilot-results.tsv
              else
                echo "::error::${name}: covered by helm test, which failed"
                printf '%s\t%s\tFAIL (helm test)\tn/a\n' "$name" "$chart_ref" >> /tmp/pilot-results.tsv
                fail_any=1
              fi
            done < /tmp/hook-pilots.txt
          fi

          while IFS= read -r pilot; do
            name="$(jq -r '.name' <<<"$pilot")"
            if grep -qxF "$name" /tmp/hook-pilots.txt; then
              continue  # covered above by the release-wide helm test
            fi
            chart_ref="$(jq -r '.chart_ref' <<<"$pilot")"
            echo "=== health-checking pilot: ${name} ==="
            if ! helm template umbrella-ci "charts/${name}" \
              -n "${NAMESPACE}" > "/tmp/rendered-${name}.yaml" 2>/tmp/render-err.txt; then
              echo "::error::${name}: helm template failed for smoke-target derivation"
              cat /tmp/render-err.txt
              printf '%s\t%s\tFAIL (render)\tn/a\n' "$name" "$chart_ref" >> /tmp/pilot-results.tsv
              fail_any=1
              continue
            fi
            if ! uv run --with pyyaml python3 /tmp/probe_targets.py "/tmp/rendered-${name}.yaml" \
              > "/tmp/targets-${name}.jsonl" 2>/tmp/derive-err.txt; then
              echo "::error::${name}: smoke-target derivation failed"
              cat /tmp/derive-err.txt
              printf '%s\t%s\tFAIL (no target)\tn/a\n' "$name" "$chart_ref" >> /tmp/pilot-results.tsv
              fail_any=1
              continue
            fi

            pilot_ok=1
            probe_summary=""
            while IFS= read -r target_json; do
              probe_svc="$(jq -re .service <<<"$target_json")"
              probe_port="$(jq -re .port <<<"$target_json")"
              probe_path="$(jq -re .path <<<"$target_json")"
              kubectl -n "${NAMESPACE}" port-forward "svc/${probe_svc}" \
                "18080:${probe_port}" >/tmp/pf-"${name}"-"${probe_svc}".log 2>&1 &
              pf_pid=$!
              sleep 6
              code=$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' \
                "http://127.0.0.1:18080${probe_path}" || echo 000)
              kill "${pf_pid}" 2>/dev/null || true
              echo "GET ${probe_path} via svc/${probe_svc}:${probe_port} -> ${code}"
              if [ "${code}" = "200" ]; then
                probe_summary="${probe_summary}svc/${probe_svc}:${probe_port}${probe_path} -> 200; "
              else
                echo "::error::${name}: ${probe_path} via svc/${probe_svc} returned ${code}, expected 200"
                probe_summary="${probe_summary}svc/${probe_svc}:${probe_port}${probe_path} -> ${code} (FAIL); "
                pilot_ok=0
              fi
            done < "/tmp/targets-${name}.jsonl"

            if [ "$pilot_ok" -eq 1 ]; then
              printf '%s\t%s\tOK\t%s\n' "$name" "$chart_ref" "$probe_summary" >> /tmp/pilot-results.tsv
            else
              printf '%s\t%s\tFAIL (probe)\t%s\n' "$name" "$chart_ref" "$probe_summary" >> /tmp/pilot-results.tsv
              fail_any=1
            fi
          done < /tmp/pilots.jsonl
          echo "all_ok=$([ "$fail_any" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit "$fail_any"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Composed Multi-Pilot Smoke Test"
            echo
            echo "| Pilot | Chart ref | Result | Probe |"
            echo "| --- | --- | --- | --- |"
            if [ -f /tmp/pilot-results.tsv ]; then
              while IFS=$'\t' read -r name chart_ref result probe; do
                echo "| \`${name}\` | \`${chart_ref}\` | ${result} | ${probe} |"
              done < /tmp/pilot-results.tsv
            else
              echo "| (no results captured — an earlier step failed before health-check ran) | | | |"
            fi
            echo
            echo "- namespace: \`${{ inputs.namespace }}\`"
            echo "- smoke_resources: \`${{ inputs.smoke_resources }}\`"
            echo "- this is a pre-merge composability artifact, not a release"
          } >> "$GITHUB_STEP_SUMMARY"
