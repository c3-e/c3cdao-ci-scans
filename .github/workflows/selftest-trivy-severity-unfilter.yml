name: Selftest — Trivy severity un-filter (T-1 / IG-0a gate)

# WHY THIS FILE EXISTS:
#
# T-1 widened reusable-security-gate.yml's TRIVY_SEVERITY env var from
# HIGH,CRITICAL to the full spectrum so Trivy's own JSON export carries
# Medium/Low findings through to the disposition pipeline (T-3/T-4), without
# changing what makes the gate itself pass or fail (evaluate_security_gate.py
# never reads Trivy's exit code — see brownfield-context.md). IG-0a's job is
# to prove that claim with a real `trivy image` invocation, not a
# hand-authored JSON blob standing in for scanner output: a JSON fixture
# would pass trivially regardless of whether T-1's actual config change does
# anything.
#
# This selftest runs TWO real, independent Trivy scans against the SAME
# built fixture image in the SAME job:
#   1. "post-fix" — using the CURRENT TRIVY_SEVERITY value, extracted live
#      from reusable-security-gate.yml at run time (not copy-pasted here, so
#      this selftest can never silently drift from what's actually
#      configured).
#   2. "pre-fix" — using the OLD HIGH,CRITICAL-only filter, simulating the
#      pre-T-1 config against the identical image.
# If T-1's widening is real, scan 1's export contains at least one Medium
# finding and scan 2's contains zero — proving the widening causes the
# difference, not fixture noise (IG-0a AC-1/AC-2). A separate step greps
# evaluate_security_gate.py for any severity/Trivy awareness at all and
# asserts there is none, proving the gate's pass/fail logic is untouched by
# any of this (AC-3).
#
# Reuses selftest-fixtures/vex-visibility/medium-cve-image/ (the same real,
# old, publicly-pullable base image with genuine accumulated CVEs already
# used by selftest-vex-tracking.yml) — no new fixture invented, per IG-0a's
# own Read-First/Exemplar-Files instructions.
#
# Trigger note (see selftest-vex-tracking.yml for the fuller explanation):
# workflow_dispatch cannot be fired on a workflow file that does not yet
# exist on the default branch, so the first real dispatch needs a temporary
# pull_request trigger via an unmerged PR. That trigger is removed once the
# first run's evidence is captured; workflow_dispatch is the permanent
# trigger for all future reruns.

on:
  workflow_dispatch:
  # Temporary, for this canary only: workflow_dispatch requires a workflow
  # file to already exist on the default branch before GitHub will
  # register it as dispatchable — a brand-new file on a feature branch
  # can't be workflow_dispatch'd yet. pull_request doesn't have that
  # restriction (GitHub evaluates the PR head ref's own workflow files),
  # so this triggers a real run via an unmerged PR against main. Removed
  # once the run is captured; workflow_dispatch is the permanent trigger
  # for future reruns after this file lands on main for real.
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trivy-severity-unfilter:
    name: Two real Trivy scans (post-fix widened vs. pre-fix HIGH,CRITICAL-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build fixture image (real, old, genuinely-vulnerable base — not a hand-authored scan result)
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            -t selftest/trivy-severity-unfilter:local \
            -f selftest-fixtures/vex-visibility/medium-cve-image/Dockerfile \
            selftest-fixtures/vex-visibility/medium-cve-image

      - name: Verify fixture image built (fail loudly, not silently — AC-4)
        run: |
          set -euo pipefail
          if ! docker image inspect selftest/trivy-severity-unfilter:local >/dev/null 2>&1; then
            echo "::error::Fixture image failed to build/load — cannot prove anything about Trivy severity un-filtering without a real image. Failing loudly rather than skipping the scans."
            exit 1
          fi
          echo "OK: fixture image selftest/trivy-severity-unfilter:local is present"

      - name: Extract current TRIVY_SEVERITY from reusable-security-gate.yml (source of truth, not hardcoded)
        id: sev
        run: |
          set -euo pipefail
          current="$(awk -F'"' '/^[[:space:]]*TRIVY_SEVERITY:/ { print $2; exit }' .github/workflows/reusable-security-gate.yml)"
          if [ -z "$current" ]; then
            echo "::error::Could not extract TRIVY_SEVERITY from .github/workflows/reusable-security-gate.yml — this selftest refuses to fall back to a hardcoded guess."
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Extracted current (post-T-1) TRIVY_SEVERITY from reusable-security-gate.yml: $current"

      - name: "Trivy scan 1 (post-fix): current widened severity filter"
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: selftest/trivy-severity-unfilter:local
          format: json
          output: post-fix.json
          severity: ${{ steps.sev.outputs.current }}
          exit-code: '0'

      - name: "Trivy scan 2 (pre-fix): OLD HIGH,CRITICAL-only filter (pre-T-1 simulation)"
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: selftest/trivy-severity-unfilter:local
          format: json
          output: pre-fix.json
          severity: "HIGH,CRITICAL"
          exit-code: '0'

      - name: Assert Medium-severity finding counts (AC-1, AC-2)
        run: |
          set -euo pipefail
          post_medium="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' post-fix.json)"
          post_low="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' post-fix.json)"
          pre_medium="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' pre-fix.json)"
          pre_low="$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' pre-fix.json)"

          echo "post-fix.json (current widened filter): MEDIUM=$post_medium LOW=$post_low"
          echo "pre-fix.json  (old HIGH,CRITICAL filter): MEDIUM=$pre_medium LOW=$pre_low"

          {
            echo "## Selftest: Trivy severity un-filter (T-1 / IG-0a)"
            echo
            echo "| scan | severity filter | MEDIUM findings | LOW findings |"
            echo "|---|---|---|---|"
            echo "| post-fix (current) | \`${{ steps.sev.outputs.current }}\` | $post_medium | $post_low |"
            echo "| pre-fix (old)      | \`HIGH,CRITICAL\` | $pre_medium | $pre_low |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          if [ "$post_medium" -lt 1 ]; then
            echo "::error::AC-1 failed: post-fix.json (current widened TRIVY_SEVERITY) has zero MEDIUM findings — expected at least 1 from the known-vulnerable fixture."
            fail=1
          fi
          if [ "$pre_medium" -ne 0 ]; then
            echo "::error::AC-2 failed: pre-fix.json (old HIGH,CRITICAL-only filter) has $pre_medium MEDIUM findings — expected exactly 0, since HIGH,CRITICAL should never surface Medium severity."
            fail=1
          fi
          if [ "$pre_low" -ne 0 ]; then
            echo "::error::AC-2 (LOW, for completeness) failed: pre-fix.json has $pre_low LOW findings — expected exactly 0."
            fail=1
          fi
          exit "$fail"

      - name: Assert evaluate_security_gate.py has no severity/Trivy awareness (AC-3)
        run: |
          set -euo pipefail
          if grep -inE 'trivy|severity' scripts/lib/evaluate_security_gate.py; then
            echo "::error::AC-3 failed: evaluate_security_gate.py contains a TRIVY/severity reference above — the gate's pass/fail logic is no longer decoupled from Trivy's own severity filter, contradicting T-1's claim."
            exit 1
          fi
          echo "OK: scripts/lib/evaluate_security_gate.py has zero TRIVY/severity references — gate pass/fail logic is untouched (AC-3)."

      - name: Upload scan exports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: trivy-severity-unfilter-exports
          path: |
            post-fix.json
            pre-fix.json
          if-no-files-found: warn
          retention-days: 1
