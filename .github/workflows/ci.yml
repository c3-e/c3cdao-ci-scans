# Repo CI for ci-scans itself: every caller-lint fixture must produce its
# expected verdict so no lint rule can silently stop firing.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  caller-lint-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Assert caller-lint fixture verdicts
        run: ./scripts/test-lint-fixtures.sh

  publish-caller-lint-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Assert publish-staging-chart caller-lint fixture verdicts
        run: ./scripts/test-lint-fixtures-publish.sh

  setup-ruleset-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Assert setup-ruleset --diff verdicts
        run: ./scripts/test-setup-ruleset-diff.sh

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
      - name: Run pytest tests/
        run: uv run --with pytest --with pyyaml python -m pytest tests/ -q
