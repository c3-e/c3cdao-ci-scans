# Repo CI for ci-scans itself: every caller-lint fixture must produce its
# expected verdict so no lint rule can silently stop firing.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  caller-lint-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Assert caller-lint fixture verdicts
        run: ./scripts/test-lint-fixtures.sh

  setup-ruleset-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Assert setup-ruleset --diff verdicts
        run: ./scripts/test-setup-ruleset-diff.sh
