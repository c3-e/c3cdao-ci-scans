# THROWAWAY: IG-1 plan-slice gate proof, Flow 1 + cumulative smoke.
# Exists only on the spike branch spike/ig1-plan-slice; never merged
# (IG-1a precedent). Drives the conforming N=3 fixture end to end on a
# hosted runner: T-4 lint clean -> T-3 derive (real bake --print) ->
# BOM published to the job summary and uploaded as an artifact. The
# blocked Flow 2 lives in throwaway-ig1-ship-set-block.yml so this run
# stays green while that one is genuinely red. Delete the branch after
# the gate closes on the run URLs.
name: ig1-plan-slice

on:
  push:
    branches: [spike/ig1-plan-slice]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan-slice:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      # Caller fixture: tests/fixtures/ig1-throwaway/caller-n3.yml
      # (committed on this spike branch only; heredocs can't carry the
      # `${{ secrets.* }}` mappings through Actions expression expansion).
      - name: "Flow 1 — lint clean on conforming N=3 fixture (real bake + helm)"
        run: |
          set -euo pipefail
          mkdir -p /tmp/ig1
          uv run --quiet scripts/lib/lint_caller.py \
            tests/fixtures/ig1-throwaway/caller-n3.yml \
            --consumer-root tests/fixtures/bake/n3-local-profile

      - name: "Flow 1 — derive annotated BOM (real bake --print)"
        run: |
          set -euo pipefail
          uv run --quiet scripts/lib/derive_bom.py \
            tests/fixtures/bake/n3-local-profile/docker-compose.yml \
            --out-dir /tmp/ig1/bom | tee /tmp/ig1/derive.log
          python3 - <<'CHECK'
          import json
          bom = json.load(open("/tmp/ig1/bom/bom.json"))
          assert bom["targets"] == ["svc-a", "svc-b", "svc-c"], bom["targets"]
          assert bom["excluded"] == [
              {"service": "svc-local", "reason": "profiles: [local]"}
          ], bom["excluded"]
          deps = bom["dependencies"]
          assert len(deps) == 1 and deps[0]["service"] == "dep-db", deps
          assert deps[0]["digest"].startswith("sha256:"), deps
          assert deps[0]["chart_tag"] == "pgvector/pgvector:pg16", deps
          assert bom["unmarked"] == [], bom["unmarked"]
          print("BOM shape OK: 3 targets, 1 exclusion with reason, 1 dependency")
          CHECK

      - name: "Flow 1 — publish BOM to job summary"
        run: |
          set -euo pipefail
          {
            echo "## Annotated Image BOM (IG-1 Flow 1, n3-local-profile)"
            echo
            echo "$(cat /tmp/ig1/derive.log)"
            echo
            echo '```json'
            python3 -m json.tool /tmp/ig1/bom/bom.json
            echo '```'
            echo
            echo "### bake plan (sibling document, --print JSON untouched)"
            echo '```json'
            python3 -m json.tool /tmp/ig1/bom/bake-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Flow 1 — upload BOM artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ig1-annotated-bom
          path: |
            /tmp/ig1/bom/bom.json
            /tmp/ig1/bom/bake-plan.json
          if-no-files-found: error

      # Cumulative smoke: IG-1a spike commands + T-1 baseline at this commit.
      - name: "Smoke (IG-1a) — plan target sets (default vs explicit)"
        working-directory: tests/fixtures/bake/n3-local-profile
        run: |
          set -euo pipefail
          default=$(docker buildx bake -f docker-compose.yml --print 2>/dev/null \
            | python3 -c "import json,sys; print(sorted(json.load(sys.stdin)['target']))")
          explicit=$(docker buildx bake -f docker-compose.yml --print svc-a svc-b svc-c 2>/dev/null \
            | python3 -c "import json,sys; print(sorted(json.load(sys.stdin)['target']))")
          echo "default=$default"
          echo "explicit=$explicit"
          test "$default" = "['svc-a', 'svc-b', 'svc-c', 'svc-local']"
          test "$explicit" = "['svc-a', 'svc-b', 'svc-c']"

      - name: "Smoke (IG-1a) — execute explicit targets via bake-action"
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b  # v7.3.0
        with:
          source: "{{defaultContext}}:tests/fixtures/bake/n3-local-profile"
          files: docker-compose.yml
          targets: |
            svc-a
            svc-b
            svc-c
          load: true

      - name: "Smoke (IG-1a) — built set excludes local-profile service"
        run: |
          set -euo pipefail
          docker images "bake-spike/*" --format "{{.Repository}}:{{.Tag}}" | sort | tee /tmp/built.txt
          printf 'bake-spike/svc-a:0.1.0\nbake-spike/svc-b:0.1.0\nbake-spike/svc-c:0.1.0\n' | diff - /tmp/built.txt

      - name: "Smoke (IG-1a) — set-override precedence, plan and execution"
        working-directory: tests/fixtures/bake/layered-args
        run: |
          set -euo pipefail
          plan_default=$(docker buildx bake -f docker-compose.yml --print 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['target']['layered']['args']['RUNTIME_IMAGE'])")
          plan_set=$(docker buildx bake -f docker-compose.yml --set '*.args.RUNTIME_IMAGE=spike-x' --print 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['target']['layered']['args']['RUNTIME_IMAGE'])")
          echo "plan_default=$plan_default plan_set=$plan_set"
          test "$plan_default" = "compose-args"
          test "$plan_set" = "spike-x"
          docker buildx bake -f docker-compose.yml --set '*.args.RUNTIME_IMAGE=spike-x' --load --no-cache
          runtime=$(docker run --rm bake-spike/layered:0.1.0)
          echo "runtime=$runtime"
          test "$runtime" = "RUNTIME_IMAGE=spike-x"

      - name: "Smoke (IG-1a) — scrubbed-env determinism and interpolation provenance"
        working-directory: tests/fixtures/bake/env-interpolated
        run: |
          set -euo pipefail
          arg_scrubbed=$(env -i PATH="$PATH" HOME="$HOME" docker buildx bake -f docker-compose.yml --print 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['target']['app']['args']['EXTRA_ARG'])")
          arg_hostenv=$(env -i PATH="$PATH" HOME="$HOME" HOST_VAR=from-host-env docker buildx bake -f docker-compose.yml --print 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['target']['app']['args']['EXTRA_ARG'])")
          echo "scrubbed=$arg_scrubbed hostenv=$arg_hostenv"
          test "$arg_scrubbed" = "from-env-file"
          test "$arg_hostenv" = "from-host-env"
          env -i PATH="$PATH" HOME="$HOME" docker buildx bake -f docker-compose.yml --print > /tmp/a.json 2>/dev/null
          env -i PATH="$PATH" HOME="$HOME" docker buildx bake -f docker-compose.yml --print > /tmp/b.json 2>/dev/null
          diff /tmp/a.json /tmp/b.json
          echo DETERMINISTIC

      - name: "Smoke (IG-1a) — plan tags equal rendered chart references (N=1, N=3)"
        run: |
          set -euo pipefail
          chart_tags() { helm template "$1/chart" | sed -nE 's/.*image: "?([^" ]+)"?.*/\1/p' | sort; }
          diff <(cd tests/fixtures/bake/n1 && docker buildx bake -f docker-compose.yml --print 2>/dev/null \
            | python3 -c "import json,sys; [print(t) for tgt in json.load(sys.stdin)['target'].values() for t in tgt['tags']]" | sort) \
            <(chart_tags tests/fixtures/bake/n1)
          echo N1_MATCH
          diff <(cd tests/fixtures/bake/n3-local-profile && docker buildx bake -f docker-compose.yml --print svc-a svc-b svc-c 2>/dev/null \
            | python3 -c "import json,sys; [print(t) for tgt in json.load(sys.stdin)['target'].values() for t in tgt['tags']]" | sort) \
            <(chart_tags tests/fixtures/bake/n3-local-profile)
          echo N3_MATCH

      - name: "Baseline (T-1) — pytest"
        run: uv run --with pytest --with pyyaml --with jsonschema pytest tests/ -q

      - name: "Baseline (T-1) — pre-commit"
        run: |
          uv tool install pre-commit
          pre-commit run --all-files

      - name: "Baseline (T-1) — lint fixtures"
        run: scripts/test-lint-fixtures.sh
