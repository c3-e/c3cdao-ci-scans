# Lint fixture: single violation — two jobs both call
# publish-staging-chart.yml (publish-decoy-job). The resolved workflow's
# own "Resolve callee (ci-scans) ref" step takes the FIRST uses: match
# in the caller file, so a second, differently-pinned job is a decoy
# vector against that resolver, mirroring lint_caller.py's
# decoy-gate-job rule for the security gate.
name: Publish Staging Chart

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  publish-staging-chart:
    if: github.event.pull_request.merged == true
    uses: c3-e/c3cdao-ci-scans/.github/workflows/publish-staging-chart.yml@0123456789abcdef0123456789abcdef01234567  # v0.1.0
    with:
      chart_path: chart
  decoy:
    if: "false"
    uses: c3-e/c3cdao-ci-scans/.github/workflows/publish-staging-chart.yml@main
    with:
      chart_path: chart
