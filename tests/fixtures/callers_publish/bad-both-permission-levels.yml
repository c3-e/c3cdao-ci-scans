# Lint fixture: single violation — permissions: declared at BOTH the
# workflow level and the calling job level (publish-permissions-both-
# levels). Confirmed live to silently produce a zero-jobs
# startup_failure with no error message anywhere.
name: Publish Staging Chart

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  packages: write

jobs:
  publish-staging-chart:
    permissions:
      packages: write
    if: github.event.pull_request.merged == true
    uses: c3-e/c3cdao-ci-scans/.github/workflows/publish-staging-chart.yml@0123456789abcdef0123456789abcdef01234567  # v0.1.0
    with:
      chart_path: chart
