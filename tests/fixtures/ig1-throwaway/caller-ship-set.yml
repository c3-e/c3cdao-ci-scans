# THROWAWAY (IG-1 harness): v0.6 caller for the ship-set-violation
# fixture. Exists only on spike/ig1-plan-slice; never merged. Caller
# structure is clean so the block comes from the ship-set convention
# rule, not from caller lint. The fixture chart has no values file.
name: Security Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    uses: c3-e/c3cdao-ci-scans/.github/workflows/reusable-security-gate.yml@0123456789abcdef0123456789abcdef01234567  # v0.6.0
    with:
      chart_path: chart
    secrets:
      CGR_PULL_TOKEN: ${{ secrets.CGR_PULL_TOKEN }}
      CGR_PULL_USERNAME: ${{ secrets.CGR_PULL_USERNAME }}
      IRONBANK_TOKEN: ${{ secrets.IRONBANK_TOKEN }}
      IRONBANK_USERNAME: ${{ secrets.IRONBANK_USERNAME }}
