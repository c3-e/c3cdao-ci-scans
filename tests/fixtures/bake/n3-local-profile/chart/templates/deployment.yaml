apiVersion: apps/v1
kind: Deployment
metadata:
  name: bake-spike-n3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bake-spike-n3
  template:
    metadata:
      labels:
        app: bake-spike-n3
    spec:
      containers:
        - name: svc-a
          image: {{ .Values.images.svcA | quote }}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
        - name: svc-b
          image: {{ .Values.images.svcB | quote }}
          readinessProbe:
            exec:
              command: ["test", "-f", "/svc.txt"]
        - name: svc-c
          image: {{ .Values.images.svcC | quote }}
          readinessProbe:
            exec:
              command: ["test", "-f", "/svc.txt"]
