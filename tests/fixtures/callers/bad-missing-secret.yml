# Lint fixture: single violation — IRONBANK_USERNAME is not mapped on the
# gate job (missing-secret-map).
name: Security Scan

on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  security-scan:
    permissions:
      contents: read
      pull-requests: write
      actions: write
    uses: c3-e/c3cdao-ci-scans/.github/workflows/reusable-security-gate.yml@0123456789abcdef0123456789abcdef01234567  # v0.6.0
    secrets:
      CGR_PULL_TOKEN: ${{ secrets.CGR_PULL_TOKEN }}
      CGR_PULL_USERNAME: ${{ secrets.CGR_PULL_USERNAME }}
      IRONBANK_TOKEN: ${{ secrets.IRONBANK_TOKEN }}
    with:
      image_only: false
