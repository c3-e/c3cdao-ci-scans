# Lint fixture: clean v0.6 caller using the full with: surface with
# image_only true (chart-owning inputs still permitted; helm-check and
# cluster-smoke are skipped at run time, not lint time).
name: Security Scan

on:
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  security-scan:
    permissions:
      contents: read
      pull-requests: write
      actions: write
    uses: c3-e/c3cdao-ci-scans/.github/workflows/reusable-security-gate.yml@0123456789abcdef0123456789abcdef01234567  # v0.6.0
    secrets:
      CGR_PULL_TOKEN: ${{ secrets.CGR_PULL_TOKEN }}
      CGR_PULL_USERNAME: ${{ secrets.CGR_PULL_USERNAME }}
      IRONBANK_TOKEN: ${{ secrets.IRONBANK_TOKEN }}
      IRONBANK_USERNAME: ${{ secrets.IRONBANK_USERNAME }}
    with:
      compose_file: docker-compose.yml
      image_only: true
      chart_path: chart
      values_local: chart/values-local.yaml
      release: app-ci
      namespace: app-ci
      smoke_resources: "postgres-pgvector,gateway-crds"
