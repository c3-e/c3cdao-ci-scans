# Publish Staging Chart caller — copied from c3cdao-ci-scans; you own this file. Edit
# the `with:` values below; separate from security-gate.yml (merge-only trigger).
name: Publish Staging Chart

on:
  pull_request:
    types: [closed]  # merged-only gate lives in the job's own `if:` below

# permissions: must stay at workflow level only — duplicating it on the job below
# silently produces a zero-jobs startup_failure with no error message.
permissions:
  contents: read
  packages: write  # required whenever publish_images: true is set below; omit only if publish_images stays false

jobs:
  publish-staging-chart:
    if: github.event.pull_request.merged == true
    uses: c3-e/c3cdao-ci-scans/.github/workflows/publish-staging-chart.yml@main  # pin a full commit SHA (trailing comment = release tag, e.g. v0.1.0); @main is pilot-only
    # Explicit mapping, not `secrets: inherit`; only needed when require_hardened_bases:
    # true and your image(s) need Chainguard/Iron Bank — delete unused pairs.
    secrets:
      CGR_PULL_TOKEN: ${{ secrets.CGR_PULL_TOKEN }}
      CGR_PULL_USERNAME: ${{ secrets.CGR_PULL_USERNAME }}
      IRONBANK_TOKEN: ${{ secrets.IRONBANK_TOKEN }}
      IRONBANK_USERNAME: ${{ secrets.IRONBANK_USERNAME }}
    with:
      # values.yaml must declare a non-empty routes: key (top-level or under
      # fullstack-template.routes:).
      chart_path: chart
      # true: retag each scan-verified quarantine image into images-staging by digest;
      # requires security-gate.yml's publish_images: true too, or nothing gets pushed.
      publish_images: false
      # Only read when publish_images is true; must match security-gate.yml's compose_file
      # or the derived target list won't match what got quarantined.
      compose_file: docker-compose.yml
      # publish_targets: ""  # optional CSV allow-list, e.g. "backend,frontend"; default is all

      # true: any image's Dockerfile FROMs a hardened base (Chainguard cgr.dev / Iron Bank
      # registry1.dso.mil) and needs the matching credential pair above.
      require_hardened_bases: false
