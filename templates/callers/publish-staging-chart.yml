# Publish Staging Chart caller — copied from c3cdao-ci-scans; you own this file.
# Edit the `with:` values below per each line's provenance comment for your repo.
# Keep the structure: permissions: at the WORKFLOW level only (never also on
# the calling job — the two together silently produce a zero-jobs
# startup_failure with no error message anywhere; see
# docs/PUBLISH-STAGING-CHART.md's "Caller gotcha").
#
# This is a separate reusable workflow from Security Scan (security-gate.yml)
# — different trigger (merge-only, not every push) and different side-effect
# profile (registry writes). See docs/CI-CONTRACT.md for why the two aren't
# folded together. See docs/PUBLISH-STAGING-CHART.md for the full contract.
name: Publish Staging Chart

on:
  pull_request:
    types: [closed]  # merged-only gate lives in the job's own `if:` below

permissions:
  contents: read
  packages: write  # required whenever publish_images: true is set below; omit only if publish_images stays false

jobs:
  publish-staging-chart:
    if: github.event.pull_request.merged == true
    uses: c3-e/c3cdao-ci-scans/.github/workflows/publish-staging-chart.yml@main  # ← pin a full commit SHA (record the release tag as a trailing comment, e.g. # v0.1.0); @main only during pilot migration
    # Explicit mapping, never `secrets: inherit` — only required when
    # require_hardened_bases: true below and your image(s) need Chainguard
    # and/or Iron Bank; delete unused pairs.
    secrets:
      CGR_PULL_TOKEN: ${{ secrets.CGR_PULL_TOKEN }}
      CGR_PULL_USERNAME: ${{ secrets.CGR_PULL_USERNAME }}
      IRONBANK_TOKEN: ${{ secrets.IRONBANK_TOKEN }}
      IRONBANK_USERNAME: ${{ secrets.IRONBANK_USERNAME }}
    with:
      chart_path: chart  # your deployable Helm chart directory (same one security-gate.yml's chart_path points at); its values.yaml MUST declare a non-empty routes: key (top-level or nested under fullstack-template.routes:)
      publish_images: false  # true: retag each images[] tuple's scan-verified quarantine image into images-staging by digest (no rebuild) — set the SAME workflow's build job's publish_images: true on security-gate.yml too, or the quarantine ref never gets pushed in the first place
      # images: JSON array, required when publish_images is true. Each
      # tuple's `target` is REQUIRED and must match byte-for-byte the bake
      # target name security-gate.yml's build job used for this image, or
      # the quarantine lookup 404s at merge time. dockerfile/context/
      # build_args are retained for documentation/audit only (this job
      # never rebuilds).
      # images: |
      #   [
      #     {"name": "app", "target": "app", "dockerfile": "Dockerfile", "context": "."}
      #   ]
      require_hardened_bases: false  # true: any declared image's Dockerfile FROMs a hardened base (Chainguard cgr.dev and/or Iron Bank registry1.dso.mil) and needs the matching credential secret pair above
