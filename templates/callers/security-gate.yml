# Security Gate caller — copied from c3cdao-ci-scans; you own this file. Edit the
# `with:` values below; build targets/tags/args derive from your Compose file (docs/CI-CONTRACT.md).
name: Security Scan

on:
  pull_request:
    branches: [main]  # ← your trunk branch(es)
  merge_group:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  security-scan:  # renaming this job id un-gates merges (half of the required check context)
    permissions:
      contents: read
      pull-requests: write
      actions: write
    uses: c3-e/c3cdao-ci-scans/.github/workflows/reusable-security-gate.yml@main  # pin a full commit SHA (trailing comment = release tag, e.g. v0.6.0); @main is pilot-only
    # Explicit secrets mapping, not `secrets: inherit` — inherit silently passes nothing
    # across org/enterprise boundaries; explicit values always evaluate correctly.
    secrets:
      CGR_PULL_TOKEN: ${{ secrets.CGR_PULL_TOKEN }}
      CGR_PULL_USERNAME: ${{ secrets.CGR_PULL_USERNAME }}
      IRONBANK_TOKEN: ${{ secrets.IRONBANK_TOKEN }}
      IRONBANK_USERNAME: ${{ secrets.IRONBANK_USERNAME }}
    with:
      compose_file: docker-compose.yml  # gate derives its build+scan legs from this Compose file's non-local services
      chart_path: chart  # helm-check lints/templates this chart; cluster-smoke installs it
      values_local: chart/values-local.yaml  # CI-only values: locally-built image tags, pullPolicy: Never
      release: app  # Helm release name for template/install
      namespace: app-ci  # Kubernetes namespace cluster-smoke installs into
      smoke_resources: ""  # CSV of smoke catalog ids provisioned pre-install (e.g. postgres-pgvector); "" = none
      image_only: false  # true: image build/scan only (skips helm-check + cluster-smoke)
      hardened_base_registry: both  # chainguard | ironbank | both — declare the tier your Dockerfile pins to
      # true: push each scan-verified target to images-quarantine for a later
      # publish-staging-chart.yml digest retag (see docs/PUBLISH-STAGING-CHART.md).
      publish_images: false
