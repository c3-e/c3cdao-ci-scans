# Example onboarding config for setup-ruleset.sh — adjust owner/repo/local_path.
# Repo shape (images, chart, health) lives in the consumer Makefile.ci, not here.
target:
  owner: your-org
  repo: your-monorepo
  default_branch: main
  trunk_branches:
    - main
  local_path: ../your-monorepo

ci_scans:
  owner: your-org
  repo: c3cdao-ci-scans
  ref: main

ruleset:
  profile: unified-gate
  name: security-scan-gates
  ruleset_id: null

workflows:
  enabled:
    - security-gate
